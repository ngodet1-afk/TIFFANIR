    if (id === 'alti') h += '<div class="ifr-card"><div class="ifr-tag">🎚 Joue avec le QNH — altitude ou niveau ?</div><div class="ifr-two"><div class="ifr-ill" id="ifrQnhSvg">' + qnhToy(1013) + '</div><div class="ifr-side"><input type="range" min="975" max="1045" value="1013" id="ifrQnh" class="ifr-range"><div class="ifr-sub" id="ifrQnhTxt"></div><button class="btn try" data-act="try" data-v="qnh">🛩 ESSAYER : régler 1008 au G1000</button> <button class="btn try" data-act="try" data-v="std">🛩 ESSAYER : STD Baro</button></div></div></div>';
    if (id === 'appr') h += '<div class="ifr-acts"><button class="btn try" data-act="try" data-v="susp">🛩 ESSAYER DANS LE COCKPIT : remise de gaz → SUSP → NAV</button></div>';
    if (id === 'g1000') h += '<div class="ifr-acts"><button class="btn try" data-act="try" data-v="cdi">🛩 ESSAYER : CDI → VOR1</button><button class="btn try" data-act="try" data-v="hdg">🛩 ESSAYER : cap 330 en HDG</button><button class="btn try" data-act="try" data-v="alt">🛩 ESSAYER : tenue d\'altitude</button></div>';
    h += '<div class="ifr-q">Fiches anti-sèche</div><div class="ifr-cards">' + d.cards.filter(function (x) { return x.ch === id; }).map(function (x) {
      return '<details class="ifr-memo"><summary>' + esc(x.t) + '</summary><div><b>À retenir</b><p>' + esc(x.keep) + '</p><b>Exemple</b><p>' + esc(x.ex) + '</p><b>Piège fréquent</b><p>' + esc(x.trap) + '</p>' + (x.note ? '<p class="ifr-verify">⚠ ' + esc(x.note) + '</p>' : '') + (x.verify ? '<p class="ifr-verify">⚠ À valider avec l\'instructeur / la source officielle.</p>' : '') + refsHtml(x.refs) + '<button class="btn" data-act="game" data-v="' + c.game + '">Tester mes connaissances</button></div></details>';
    }).join('') + '</div></div>';

  }
  function qnhToy(qnh) {
    var a = altOfFl(50, qnh), y = function (v) { return 200 - v / 7000 * 180; };
    return '<svg class="ifr-svg" viewBox="0 0 260 210"><rect width="260" height="210" fill="#0c1a2b"/><path d="M0,' + y(0) + ' L260,' + y(0) + ' L260,210 L0,210Z" fill="#4a3a22"/><text x="6" y="' + (y(0) - 4) + '" font-size="10" fill="#c8d4e4">niveau de la mer</text>' +
      '<line x1="0" x2="260" y1="' + y(5000) + '" y2="' + y(5000) + '" stroke="#3fe0e8" stroke-dasharray="5 4"/><text x="254" y="' + (y(5000) + 12) + '" font-size="10" fill="#3fe0e8" text-anchor="end">5 000 ft (altitude, QNH)</text>' +
      '<path d="M0,' + y(a) + ' C80,' + (y(a) - 6) + ' 180,' + (y(a) + 6) + ' 260,' + y(a) + '" stroke="#f2c21b" stroke-width="2.5" fill="none"/><text x="6" y="' + (y(a) - 6) + '" font-size="11" fill="#f2c21b" font-weight="700">FL 50 ≈ ' + a + ' ft</text></svg>';
  }
  function sourcesHtml() {
    var S = D().sources, h = '<div class="ifr-in"><div class="ifr-top"><div><div class="ifr-title">§ Sources du module IFR</div><div class="ifr-sub">Vérifiées le ' + esc(D().checked) + '. Les documents école (OM-B, PDP, Garmin) restent locaux et ne sont jamais publiés.</div></div><button class="btn" data-act="home">↩</button></div>';
    h += refsHtml(Object.keys(S));
    h += '<div class="ifr-disc">Mise à jour : les textes et les exercices sont dans js/data/ifr.js (sources, date de vérification, références par exercice). Ordre de priorité : règle européenne → particularité française → procédure locale → type d\'exploitation → avion → consigne opérateur → astuce.</div></div>';
    return h;

  I.view = 'home';
  I.show = function (v) {
    if (v === 'resume' && G) { el().classList.remove('hidden'); renderGame(); return; }
    if (v) I.view = v; if (v === 'resume') I.view = 'home';
    if (TF.Ess) TF.Ess.close(); TF.Home.hide(); stopTry();
    var e = el(); G = null;
    e.innerHTML = K.plain(I.view === 'sources' ? sourcesHtml() : /^ch:/.test(I.view) ? chapHtml(I.view.slice(3)) : homeHtml());
    e.classList.remove('hidden'); e.scrollTop = 0;
    var r = K.$('ifrQnh'); if (r) { var up = function () { K.$('ifrQnhSvg').innerHTML = qnhToy(+r.value); K.$('ifrQnhTxt').innerHTML = 'QNH <b>' + r.value + '</b> hPa : le niveau 50 est à environ <b>' + altOfFl(50, +r.value) + ' ft</b> d\'altitude.<br><small>QNH bas → niveaux plus bas. ≈ 27 ft/hPa (approximation pédagogique).</small>'; }; r.oninput = up; r.onchange = up; up(); }
  };
  I.hide = function () { var e = el(); if (e) e.classList.add('hidden'); if (TF.Voice) TF.Voice.stop(); };
  I.close = function () { G = null; clearTimeout(I._tt); stopTry(); I.hide(); };

  I.state = function () { return G; };

  /* ---------------- Actions ---------------- */
  function bind() {

      sixty: function () { start('sixty', 'learn'); },
      final: function () { start('final', 'exam'); },
      learn: function () { var m = K.$('ifrMap'); if (m && m.scrollIntoView) m.scrollIntoView(); },
      defi: function () { var day = TF.Profiles.dayId(), p = day.split('-'); start('mission', 'exam', { seed: +p[0] * 400 + +p[1] * 32 + +p[2], day: day }); },
      chap: function (b) { I.show('ch:' + b.getAttribute('data-v')); },
      game: function (b) { start(b.getAttribute('data-v'), 'learn'); },
      exam: function (b) { start(b.getAttribute('data-v'), 'exam'); },
      board: function () { var f = prof(); f.showBoard = !f.showBoard; TF.Profiles.save(); I.show('home'); },
      sources: function () { I.show('sources'); },
      quit: function () { if (G && (G.i > 0 || G.answered)) { if (G.answered) G.i++; finish(); return; } G = null; clearTimeout(I._tt); I.show(); },
      again: function () { var l = I._last || { kind: 'mission', mode: 'learn' }; if (l.day) { bindDefi(); return; } start(l.kind, l.mode); },
      say: function () { say(G.list[G.i].it.atc); },
      trans: function () { G.transcript = true; renderGame(); },
      pick: function (b) { if (G.answered) return; G.picked.push(+b.getAttribute('data-v')); K.sound.click && K.sound.click(); renderGame(); },
      unpick: function (b) { if (G.answered) return; G.picked.splice(+b.getAttribute('data-v'), 1); renderGame(); },
      clear: function () { G.picked = []; renderGame(); },
      hint: function () { G.hint = true; renderGame(); },
      send: function () { if (!G.picked.length) { K.toast('Touche au moins un fragment.', 'info'); return; } var it = G.list[G.i].it, r = judgeRadio(it, G.picked); answer(r.ok, r.crit, r.msgs); },
      choose: function (b) { if (G.answered) return; var it = G.list[G.i].it, v = +b.getAttribute('data-v'); G.pick = v; var ok = v === it.ans; answer(ok, !ok && (it.crit || []).indexOf(v) >= 0, null); },
      next: function () { next(); },
      try: function (b) { I.tryCockpit(b.getAttribute('data-v')); }
    });
  }
  function bindDefi() { var day = TF.Profiles.dayId(), p = day.split('-'); start('mission', 'exam', { seed: +p[0] * 400 + +p[1] * 32 + +p[2], day: day }); }
  I.init = function () { if (el()) bind(); };
  I._judgeRadio = judgeRadio; I._altOfFl = altOfFl; I._approachSeq = approachSeq;
})(this);

<script>/* js/ui/checklist-ui.js */
/* Interface — module CHECK-LISTS (distinct des flows), méthode PDP « Use of check-list » p.101-104 :
 * appel de la C/L, lecture de chaque item, contrôle réel, réponse, confirmation, « … C/L COMPLETE », C/L suivante.
 * Découvrir : lecture commentée automatique ; S'entraîner : accompagnée ; De mémoire : autonome.
 * Les C/L « bold line » (AFTER TAKEOFF, FINAL) se disent par cœur (PDP p.102) : libellés masqués en mode mémoire.
 */
(function (root) {
  'use strict';
  var TF = root.TF, K = TF.UI, esc = TF.util.esc, V = TF.Voice;

  function CL(app) { this.app = app; this.run = null; this.await = -1; this.msg = null; }
  var P = CL.prototype;
  function byId(id) { return TF.DATA.checklists.filter(function (c) { return c.id === id; })[0]; }

  P.active = function () { return !!this.run; };
  P.start = function (id, level, onDone) {
    var def = byId(id); if (!def) return;
    this.level = level; this.onDone = onDone;
    this.run = new TF.ChecklistRun(def, this.app.ck, level === 'memory' ? 'autonomous' : 'accompanied');
    this.await = -1; this.msg = null; this.nextCalled = false; this.gen = (this.gen || 0) + 1;
    K.closeSheet(); this.render();
    if (level === 'discover') this.autoplay();
    else if (level === 'memory') V.say('À toi : check-list ' + def.title + ', de mémoire.', 'fr');
  };
  P.stop = function () { this.run = null; this.await = -1; this.gen = (this.gen || 0) + 1; this.app.view.clearHighlight(); };
  P.expectedCallout = function () {
    var r = this.run; if (!r) return null;
    if (!r.calledStart) return r.def.call;
    if (r.done() && !r.calledComplete) return r.def.complete;
    if (r.calledComplete && !this.nextCalled) return 'Next C/L will be ' + r.def.nextName;
    return null;
  };
  P.onCallout = function (text) {
    var r = this.run; if (!r) return false;
    var exp = this.expectedCallout();
    if (!r.calledStart) r.calledStart = true;
    else if (r.done() && !r.calledComplete) r.calledComplete = true;
    else if (r.calledComplete && !this.nextCalled) this.nextCalled = true;
    else return false;
    this.msg = { k: 'ok', m: 'Annonce enregistrée.' };
    if (this.level === 'practice' && exp) V.say(exp, 'en');
    this.render(); return true;
  };
  P.targetOf = function (i) { var v = this.run.def.items[i].verify; return v.ctl || v.zone || null; };

  /* « Regarder » en autonome : la prochaine touche cockpit désigne l'élément contrôlé */
  P.intercept = function (kind, id) {
    if (this.await < 0 || kind === 'press') return false;
    var i = this.await, tg = this.targetOf(i), v = this.run.def.items[i].verify;
    var hit = kind === 'ctl' ? (id === v.ctl || (v.zone && this.app.ck.defs[id] && this.app.ck.defs[id].region === v.zone)) : (kind === 'ind' && (id === v.zone || (v.zone === 'cb_panel' && id === 'cb_bottom') || (v.zone === 'botM' && id === 'gear_lights')));
    this.await = -1;
    if (hit) { var r = this.run.look(i); this.msg = { k: r.conform === false ? 'err' : 'info', m: '👁 ' + esc(r.seen) }; this.app.view.clearHighlight(); this.app.view.highlight(tg || id, r.conform === false ? 'err' : 'ok'); }
    else { this.run.aid(i); this.msg = { k: 'err', m: 'Ce n\'est pas l\'élément de « ' + esc(this.run.def.items[i].label) + ' ». Réessaie (compté comme aide).' }; }
    this.render(); return true;
  };
  P.onObserve = function () { };
  P.onConfirmItem = function () { };

  P.look = function (i) {
    var r = this.run, tg = this.targetOf(i), v = this.app.view;
    if (r.mode === 'accompanied') {
      var res = r.look(i);
      v.clearHighlight(); if (tg) { v.focusOn(tg); v.highlight(tg, res.conform === false ? 'err' : 'pulse'); }
      this.msg = { k: res.conform === false ? 'err' : 'info', m: '👁 ' + esc(res.seen) + (res.conform === false ? ' — corrige dans le cockpit puis re-regarde.' : '') };
    } else if (!tg) { var rr = r.look(i); this.msg = { k: 'info', m: esc(rr.seen) }; }
    else { this.await = i; this.msg = null; }
    this.render();
  };
  P.confirm = function (i) {
    var r = this.run, d = r.def, res = r.confirm(i);
    if (res.ok) { K.sound.ok(); this.msg = { k: 'ok', m: '✓ ' + esc(d.items[i].label) + ' … ' + esc(d.items[i].resp) }; this.app.view.clearHighlight(); if (this.level === 'practice') V.say(d.items[i].label.replace(/\(.*?\)/g, '') + '. ' + d.items[i].resp + '.', 'en'); }
    else { K.sound.err(); this.msg = { k: 'err', m: esc(res.reason) }; }
    this.render();
  };

  /* Découvrir : lecture automatique challenge / réponse */
  P.autoplay = function () {
    var self = this, my = this.gen, r = this.run, d = r.def, i = 0, v = this.app.view, ses = this.app.modes;
    function alive() { return self.gen === my && !!self.run; }
    function say(t, cb) { ses.dSay(t, 'en', cb, null, alive); }
    say(d.call, function () { r.calledStart = true; self.render(); step(); });
    function step() {
      if (!alive()) return;
      if (i >= d.items.length) {
        say(d.complete, function () { r.calledComplete = true; self.render();
          say('Next C/L will be ' + d.nextName, function () { self.nextCalled = true; self.render(); ses.dWait(600, function () { self.end(); }, alive); }); });
        return;
      }
      var it = d.items[i], tg = self.targetOf(i);
      r.look(i); if (tg) { v.focusOn(tg); v.clearHighlight(); v.highlight(tg, 'pulse'); }
      self.render();
      say(it.label.replace(/\(.*?\)/g, '') + '. ' + it.resp + '.', function () {
        r.respond(i, false); var c = r.confirm(i);
        if (!c.ok) { r.items[i].confirmed = true; r.items[i].nonConformSeen = true; }
        if (r.idx === i) r.idx = i + 1;
        i++; self.render(); ses.dWait(250, step, alive);
      });
    }
  };

  /* Carte de check-list « papier » : appel, items, COMPLETE, check-list suivante.
   * Ligne en cours encadrée (avec ses actions), lignes faites en vert, la ligne d'avant et d'après restent visibles. */
  P.render = function () {
    var r = this.run, b = K.$('instrBody'); if (!r) return;
    var d = r.def, auto = r.mode === 'autonomous', heart = d.byHeart && auto, self = this, ses = this.app.modes, h = ses.phase ? ses.headerHtml() : '';
    var disc = this.level === 'discover', done = r.done();
    function callRow(state, text, hidden) {
      var cls = state === 'done' ? ' ok' : state === 'cur' ? ' cur' : '';
      var x = '<div class="clc-row call' + cls + '"><span class="clc-n">🎙</span><span class="clc-l">' + (hidden ? '<i>annonce</i>' : '« ' + esc(text) + ' »') + '</span><span class="clc-r">' + (state === 'done' ? '✓' : 'ANNONCE') + '</span></div>';
      if (state === 'cur' && !disc) x = x.replace(/<\/div>$/, '<div class="clc-acts"><button class="btn primary block" data-act="call">✅ J\'ai fait l\'annonce</button></div></div>');
      return x;
    }
    h += '<div class="clc"><div class="clc-top"><span>' + esc(d.title) + ' CHECK-LIST</span>' + (d.byHeart ? '<em>par cœur</em>' : '') + '</div>';
    h += '<div class="clc-src">' + esc(TF.refText(d.ref)) + '</div>';
    if (d.divergence) { var dv = TF.DATA.divergences.filter(function (x) { return x.id === d.divergence; })[0]; h += '<div class="caution" style="font-size:11.5px;margin:6px 8px"><b>' + dv.id + '</b> — ' + esc(dv.decision) + '</div>'; }
    h += '<div class="clc-list">';
    h += callRow(r.calledStart ? 'done' : 'cur', d.call, auto);
    d.items.forEach(function (it, i) {
      var st = r.items[i], cur = r.calledStart && i === r.idx && !st.confirmed;
      if (it.line) h += '<div class="cl-line">BELOW THE LINE</div>';
      var showLab = !heart || st.confirmed || st.looked, showResp = !auto || st.responded || st.confirmed;
      h += '<div class="clc-row' + (cur ? ' cur' : '') + (st.confirmed ? (st.nonConformSeen ? ' warn' : ' ok') : '') + '"><span class="clc-n">' + (i + 1) + '</span><span class="clc-l">' + (showLab ? esc(it.label) : '· · ·') + '</span><span class="clc-r">' + (showResp ? esc(it.resp) + (it.sic ? ' <small>[sic]</small>' : '') : '· · ·') + (st.confirmed ? ' ✓' : '') + '</span>';
      if (cur && !disc) {
        var kind = r.inspect(i).kind;
        h += '<div class="clc-acts">';
        if (kind !== 'declarative' || it.verify.zone) h += '<button class="btn" data-act="look" data-i="' + i + '">👁 ' + (st.looked ? 'Re-regarder' : 'Regarder') + '</button>';
        if (!st.responded) h += '<button class="btn" data-act="resp" data-i="' + i + '">🗣 J\'ai répondu</button>' + (auto ? '<button class="btn" data-act="reveal" data-i="' + i + '">Révéler</button>' : '');
        h += '<button class="btn primary" data-act="conf" data-i="' + i + '">✓ Confirmer</button>';
        if (st.seen) h += '<div class="sc-note">Constaté : ' + esc(st.seen) + '</div>';
        if (kind === 'declarative') h += '<div class="toconfirm">Vérification déclarative (non simulée)</div>';
        h += '</div>';
      }
      h += '</div>';
    });
    h += callRow(r.calledComplete ? 'done' : (done ? 'cur' : ''), d.complete, auto);
    h += callRow(this.nextCalled ? 'done' : (r.calledComplete ? 'cur' : ''), 'Next C/L will be ' + d.nextName, auto);
    h += '</div></div>';
    if (this.await >= 0) h += '<div class="feedback info">Touche dans le cockpit l\'élément de « ' + esc(heart ? 'item ' + (this.await + 1) : d.items[this.await].label) + ' ».</div>';
    if (this.msg) h += '<div class="feedback ' + this.msg.k + '">' + this.msg.m + '</div>';
    if (done && !disc && this.nextCalled) h += '<button class="btn primary big block" data-act="end">Check-list terminée ▶</button>';
    if (disc && ses.phase) h += ses.demoControls();
    h += '<button class="btn link" data-act="quit">Quitter la séance</button>';
    b.innerHTML = K.plain(h);
    TF.UI.centerCurrent(b.querySelector('.clc-list'), b.querySelector('.clc-row.cur'));
    K.bindActs(b, {
      call: function () { TF.Interact.declareCallout(); },
      look: function (el) { self.look(+el.getAttribute('data-i')); },
      resp: function (el) { r.respond(+el.getAttribute('data-i'), false); self.render(); },
      reveal: function (el) { r.respond(+el.getAttribute('data-i'), true); self.render(); },
      conf: function (el) { self.confirm(+el.getAttribute('data-i')); },
      end: function () { self.end(); },
      pause: function () { ses.togglePause(); }, speed: function (el) { ses.setDemoSpeed(+el.getAttribute('data-v')); },
      toPractice: function () { self.stop(); ses.startPhase(ses.phase.id, 'practice', ses.idx); },
      quit: function () { self.stop(); ses.idle(); TF.Home.show(); }
    });
  };
  P.end = function () {
    var res = this.run.result(), cb = this.onDone;
    TF.Profiles.recordChecklist(res);
    this.stop();
    if (cb) cb(res);
  };
  TF.ChecklistUI = CL;
})(this);

</script>
<script>/* js/ui/screens.js */
/* Interface — écrans : accueil, bibliothèque d'entraînement, débriefing, briefing, profil, prochain vol, base documentaire. */
(function (root) {
  'use strict';
  var TF = root.TF, K = TF.UI, esc = TF.util.esc, PE = TF.ProcEngine;
  var S = TF.Screens = {};
  var app;
  S.init = function (a) { app = a; };
  var ST = {
    ok: ['✓ Réussie', 's-ok'], ok_aided: ['✓ Avec aide', 's-aid'], omitted: ['✗ Oubliée', 's-om'], wrong: ['✗ Incorrecte', 's-err'],
    changed: ['✗ Position modifiée ensuite', 's-err'], order: ['✗ Ordre prescrit', 's-err'], invalid: ['✗ Non conforme', 's-err'], na: ['— Non requise', 's-na']
  };

  /* ---------------- Accueil : choix du pilote ---------------- */
  S.splash = function (onPick) {
    var el = K.$('splash'), h = '<div class="sp-in"><img class="sp-logo" src="assets/logo-512.png" alt="TIFFAN\'IR (ME)">';

  /* ---------------- Sessions ---------------- */
  S.session = function (id) {

      var plan = TF.Trainer.plan(p, 10).slice(0, 2);
      return m.startChain(plan.map(function (x) { return { type: 'proc', id: x.proc, mode: 'memory' }; }), 'Répétition des flows (10 min)');
    }
    if (id === 'prep') {
      var f = p.flights[p.nextFlight] || { procs: [] }, procs = f.procs.filter(function (x) { return PE.procById(x); });
      if (!procs.length) procs = TF.DATA.procedures.map(function (x) { return x.id; });

    }

    order.forEach(function (id) { var pr = PE.procById(id); items.push({ type: 'proc', id: id, mode: 'memory' }); if (pr.next && pr.next.checklist) items.push({ type: 'cl', id: pr.next.checklist, mode: 'autonomous' }); });
    K.closeSheet(); app.modes.startChain(items, title);
  };
  S.startChainStartup = function (m) {
    K.closeSheet();
    m.startChain([{ type: 'proc', id: 'before-start', mode: 'memory' }, { type: 'cl', id: 'cl-before-start', mode: 'autonomous' }, { type: 'proc', id: 'start-up', mode: 'memory' }, { type: 'proc', id: 'after-start', mode: 'memory' }, { type: 'cl', id: 'cl-after-start', mode: 'autonomous' }], 'Chair flying — mise en route complète');
  };
  S.reviewErrors = function () {
    var p = TF.Profiles.current(), items = [];

        h += '<div class="vc-row' + (on ? ' on' : '') + '"><button class="vc-pick" data-act="pick" data-lang="' + lang + '" data-uri="' + esc(v.voiceURI || v.name) + '">' + (on ? '● ' : '○ ') + esc(v.name) + ' <small>' + esc(v.lang) + (i === 0 ? ' · meilleure détectée' : '') + '</small></button>' +
          '<button class="btn" data-act="test" data-lang="' + lang + '" data-uri="' + esc(v.voiceURI || v.name) + '" data-s="' + esc(sample) + '">▶ Tester</button></div>';
      });
      return h + '</div>';
    }
    var h = K.head('🗣 Choisir les voix') + '<p class="explain">L\'appli utilise les voix installées sur ton appareil. La qualité dépend donc de l\'appareil : choisis la plus naturelle, ton choix est gardé.</p>';
    if (!V.available()) h += '<div class="feedback err">La synthèse vocale n\'est pas disponible dans ce navigateur.</div>';
    h += block('fr', '🇫🇷 Voix française (explications, briefings)', 'Avant mise en route. Visite prévol terminée, passagers à bord.');
    h += block('en', '🇬🇧 Voix anglaise (items OM-B, check-lists, annonces)', 'Before start check-list. Passengers, briefed. Elect master, on.');
    h += '<div class="vc-tips"><b>Pour une voix française de meilleure qualité, télécharge une voix « Améliorée » ou « Premium » (gratuit) :</b><ul>' +
      '<li><b>iPad / iPhone</b> : Réglages › Accessibilité › Contenu énoncé › Voix › Français › choisis « Thomas » ou « Audrey » et télécharge la version <i>Améliorée</i> / <i>Premium</i>. (iOS 12 : Réglages › Général › Accessibilité › Parole › Voix.)</li>' +
      '<li><b>Mac</b> : Réglages Système › Accessibilité › Contenu énoncé › Voix du système › Gérer les voix › Français.</li>' +
      '<li><b>PC / Chrome</b> : les voix « Google français » ou « Microsoft … Online (Natural) » (Edge) sont les plus naturelles.</li></ul>Ensuite, recharge l\'appli : la nouvelle voix apparaît dans la liste ; touche-la pour la choisir.</div>';
    K.sheet(h, function (s) {
      K.bindActs(s, {
        pick: function (b) { V.setPreferred(b.getAttribute('data-lang'), b.getAttribute('data-uri')); S.voices(); },
        test: function (b) {
          var lang = b.getAttribute('data-lang'), old = V.preferred(lang);
          V.setPreferred(lang, b.getAttribute('data-uri')); V.stop(); V.say(b.getAttribute('data-s'), lang, function () { }); V.setPreferred(lang, old);
        }
      });
    }, { width: '720px' });
  };

  /* ---------------- Profil et progression ---------------- */
  S.profile = function () {
    var p = TF.Profiles.current(), h = K.head('Progression — ' + esc(p.name));
    var flows = p.history.filter(function (x) { return x.kind === 'flow'; });
    var perfect = flows.filter(function (x) { return x.perfect && (x.mode === 'memory' || x.mode === 'exam'); }).length;
    h += '<div class="grid g4"><div class="cell"><div class="tile stat cy"><b>' + flows.length + '</b><span>flows travaillés</span></div></div><div class="cell"><div class="tile stat ok"><b>' + perfect + '</b><span>parfaits sans aide</span></div></div><div class="cell"><div class="tile stat"><b>' + p.history.filter(function (x) { return x.kind === 'checklist'; }).length + '</b><span>checklists</span></div></div><div class="cell"><div class="tile stat warn"><b>' + TF.Profiles.frequentErrors(p, 99).length + '</b><span>étapes à revoir</span></div></div></div>';
    h += '<div class="sh-sec">Maîtrise par procédure</div><div class="card">';
    TF.DATA.procedures.forEach(function (pr) { var ms = Math.round(TF.Trainer.mastery(p, pr.id) * 100), x = p.procs[pr.id]; h += '<div class="kv"><span>' + esc(pr.title) + (x && x.due ? ' · prochaine révision ' + (x.due <= Date.now() ? '<b class="s-om">maintenant</b>' : TF.util.fmtDate(x.due)) : '') + '</span><span>' + ms + ' %</span></div><div class="mbar" style="margin:2px 0 8px"><i style="width:' + ms + '%"></i></div>'; });
    h += '</div><div class="sh-sec">Erreurs fréquentes</div><div class="card">';
    var fe = TF.Profiles.frequentErrors(p, 8);
    if (!fe.length) h += '<div class="explain">Aucune pour l\'instant.</div>';
    fe.forEach(function (e) { var a = e.key.split('/'), pr = PE.procById(a[0]), st = pr && PE.stepById(pr, a[1]); if (st) h += '<div class="kv"><span>' + esc(pr.title + ' · ' + st.n + ' ' + st.label + ' — ' + st.response) + '</span><span class="s-err">' + e.fails + ' échec(s)</span></div>'; });
    h += '</div><div class="sh-sec">Historique récent</div><table class="t"><tr><th>Date</th><th>Exercice</th><th>Mode</th><th>Résultat</th></tr>';
    p.history.slice(-12).reverse().forEach(function (x) {
      var name = x.kind === 'flow' ? (PE.procById(x.proc) || { title: x.proc }).title : 'C/L ' + x.proc.replace('cl-', '').toUpperCase();
      h += '<tr><td>' + TF.util.fmtDate(x.t) + '</td><td>' + esc(name) + '</td><td>' + esc(x.mode) + '</td><td class="st ' + (x.perfect ? 's-ok' : 's-om') + '">' + x.okNoAid + '/' + x.total + (x.perfect ? ' ✓' : '') + '</td></tr>';
    });
    h += '</table><div class="sh-sec">Sauvegarde</div><p class="explain">Sauvegarde automatique sur cet appareil' + (TF.Profiles.isPersistent() ? '' : ' <b class="s-err">indisponible</b>') + '. Exporte régulièrement pour ne rien perdre (ou pour passer du Mac à l\'iPad).</p>';
    h += '<button class="btn primary" data-act="export">Exporter les résultats (5 pilotes)</button><label class="btn">Importer…<input type="file" accept=".json,application/json" id="impFile" style="display:none"></label><button class="btn" data-act="switch">Changer de pilote</button><button class="btn danger" data-act="reset">Réinitialiser ' + esc(p.name) + '</button>';
    K.sheet(h, function (s) {
      K.bindActs(s, {
        export: function () { S.exportFile(); },
        switch: function () { K.closeSheet(); S.splash(function () { app.onProfile(); }); },
        reset: function (b) { if (b.getAttribute('data-sure') !== '1') { b.setAttribute('data-sure', '1'); b.textContent = 'Confirmer : tout effacer pour ' + p.name; return; } TF.Profiles.resetProfile(p.id); K.closeSheet(); K.toast('Profil réinitialisé', 'ok'); }
      });
      var f = s.querySelector('#impFile');
      f.onchange = function () {
        var file = f.files[0]; if (!file) return; var rd = new FileReader();
        rd.onload = function () { var r = TF.Profiles.importAll(String(rd.result)); K.toast(r.ok ? 'Import réussi' : esc(r.reason), r.ok ? 'ok' : 'err'); if (r.ok) { K.closeSheet(); app.onProfile(); } };
        rd.readAsText(file);
      };
    });
  };
  S.exportFile = function () {
    var data = TF.Profiles.exportAll(), name = 'tiffanir-resultats-' + new Date().toISOString().slice(0, 10) + '.json';
    try {
      var blob = new Blob([data], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    } catch (e) { }
    // Toujours proposer la copie : certains navigateurs (iPad, page intégrée) bloquent le téléchargement.
    K.sheet(K.head('Export des résultats') + '<p class="explain">Si le fichier <b>' + esc(name) + '</b> ne s\'est pas téléchargé, copie ce texte et enregistre-le (Notes, Fichiers, mail). Pour restaurer : Profil → Importer, ou colle-le ci-dessous.</p>' +
      '<button class="btn primary" data-act="copy">Copier le texte</button><textarea class="inp" id="expTxt" style="min-height:220px">' + esc(data) + '</textarea>' +
      '<div class="sh-sec">Importer par collage</div><textarea class="inp" id="impTxt" placeholder="Colle ici une sauvegarde TIFFAN\'IR"></textarea><button class="btn" data-act="imp">Importer</button>', function (sh) {
      K.bindActs(sh, {
        copy: function () {
          var ta = sh.querySelector('#expTxt');
          function fallback() { ta.focus(); ta.select(); try { document.execCommand('copy'); K.toast('Copié', 'ok'); } catch (e) { K.toast('Sélectionne le texte et copie-le', 'warn'); } }
          try { navigator.clipboard.writeText(data).then(function () { K.toast('Copié', 'ok'); }, fallback); } catch (e) { fallback(); }
        },
        imp: function () { var r = TF.Profiles.importAll(sh.querySelector('#impTxt').value); K.toast(r.ok ? 'Import réussi' : esc(r.reason), r.ok ? 'ok' : 'err'); if (r.ok) { K.closeSheet(); app.onProfile(); } }
      });
    });
  };

  /* ---------------- Prêt pour mon prochain vol ---------------- */
  function labelFlight(id) { return (TF.Profiles.FLIGHTS.filter(function (f) { return f.id === id; })[0] || {}).label || id; }
  S.nextFlight = function (fid) {
    var p = TF.Profiles.current(); fid = fid || p.nextFlight || 'sim';
    var f = p.flights[fid], h = K.head('Prêt pour mon prochain vol');
    h += '<span class="seg">' + TF.Profiles.FLIGHTS.map(function (x) { return '<button data-act="pickF" data-id="' + x.id + '" class="' + (x.id === fid ? 'on' : '') + '">' + x.label + '</button>'; }).join('') + '</span>';
    h += '<div class="caution" style="margin:8px 0">Le programme de formation (objectifs des 6 vols et du simulateur) ne figure pas dans les documents fournis : rien n\'est inventé. Saisis les objectifs communiqués par ton instructeur.</div>';
    h += '<div class="grid g2"><div class="cell"><div class="lbl">Date de la séance</div><input class="inp" id="fDate" type="text" placeholder="jj/mm/aaaa" value="' + esc(f.date) + '"><div class="lbl" style="margin-top:10px">Objectifs pédagogiques (saisie)</div><textarea class="inp" id="fObj" placeholder="Ex. : mise en route, roulage, décollage, circuit…">' + esc(f.objectives) + '</textarea><div class="lbl" style="margin-top:10px">Notes / briefing instructeur</div><textarea class="inp" id="fNotes">' + esc(f.notes) + '</textarea></div>';
    h += '<div class="cell"><div class="lbl">Procédures et checklists à maîtriser</div>';
    TF.DATA.procedures.forEach(function (pr) { var ms = Math.round(TF.Trainer.mastery(p, pr.id) * 100); h += '<label class="chk"><input type="checkbox" data-proc="' + pr.id + '"' + (f.procs.indexOf(pr.id) >= 0 ? ' checked' : '') + '>' + esc(pr.title) + ' <span style="margin-left:auto;color:#8fa1b8;font-size:12px">' + ms + ' %</span></label>'; });
    h += '<div class="explain" style="font-size:12px">Checklists associées : BEFORE START, AFTER START (ajoutées automatiquement à l\'entraînement).</div>';
    h += '<div class="lbl" style="margin-top:12px">Éléments cockpit à réviser</div><div class="card" style="font-size:12.5px">' + cockpitItemsFor(f.procs) + '</div>';
    h += '<div class="lbl" style="margin-top:12px">Briefings / annonces</div><div class="card" style="font-size:12.5px">' + calloutsFor(f.procs) + '</div></div></div>';
    h += '<button class="btn primary big" data-act="save">Enregistrer</button><button class="btn gold big" data-act="train">Entraînement ciblé (20–30 min)</button><button class="btn" data-act="setNext">Définir comme prochain vol</button>';
    K.sheet(h, function (s) {
      function collect() {
        var procs = []; Array.prototype.forEach.call(s.querySelectorAll('[data-proc]'), function (c) { if (c.checked) procs.push(c.getAttribute('data-proc')); });
        return { date: s.querySelector('#fDate').value, objectives: s.querySelector('#fObj').value, notes: s.querySelector('#fNotes').value, procs: procs };
      }
      K.bindActs(s, {
        pickF: function (b) { TF.Profiles.setFlight(fid, collect()); S.nextFlight(b.getAttribute('data-id')); },
        save: function () { TF.Profiles.setFlight(fid, collect()); K.toast('Séance enregistrée', 'ok'); },
        setNext: function () { TF.Profiles.setFlight(fid, collect()); p.nextFlight = fid; TF.Profiles.save(); K.toast(labelFlight(fid) + ' défini comme prochain vol', 'ok'); },
        train: function () { var c = collect(); TF.Profiles.setFlight(fid, c); p.nextFlight = fid; TF.Profiles.save(); S.startChainFor(c.procs.length ? c.procs : TF.DATA.procedures.map(function (x) { return x.id; }), 'Préparation : ' + labelFlight(fid)); }
      });
    });
  };
  function cockpitItemsFor(procs) {
    var seen = {}, out = [];
    TF.DATA.procedures.forEach(function (pr) { if (procs.length && procs.indexOf(pr.id) < 0) return; pr.steps.forEach(function (s) { var ids = (s.ctl ? [s.ctl] : []).concat(s.ctls || []); ids.forEach(function (id) { var d = app.ck.defs[id]; if (d && !seen[id] && d.type !== 'softkey') { seen[id] = 1; out.push('<span class="tag">' + esc(d.short) + '</span>'); } }); }); });
    return out.join(' ') || '—';
  }
  function calloutsFor(procs) {
    var out = [];
    TF.DATA.procedures.forEach(function (pr) { if (procs.length && procs.indexOf(pr.id) < 0) return; pr.steps.forEach(function (s) { if (s.kind === 'callout') out.push('« ' + esc(s.text) + ' »'); if (s.kind === 'briefing') out.push('<b>' + esc(TF.DATA.briefings[s.briefing].title) + '</b>'); }); });
    return out.join('<br>') || '—';
  }

  /* ---------------- Base documentaire ---------------- */
  S.docs = function () {
    var h = K.head('Base documentaire et traçabilité');
    h += '<p class="explain">Chaque étape de l\'application est rattachée à sa source (document, version, section, page). Les éléments insuffisamment documentés sont marqués « À confirmer » et ne sont pas présentés comme procédure officielle.</p>';
    h += '<div class="sh-sec">Sources</div><table class="t"><tr><th>Document</th><th>Version</th><th>Usage</th></tr>';
    TF.DATA.sources.forEach(function (s) { h += '<tr><td><b>' + esc(s.title) + '</b><div style="font-size:11px;color:#8fa1b8">' + esc(s.file) + '</div></td><td>' + esc(s.version) + '<br><small>' + esc(s.date) + '</small></td><td style="font-size:12px">' + esc(s.note) + '</td></tr>'; });
    h += '</table><div class="sh-sec">Configuration avion identifiée</div><table class="t"><tr><th>Élément</th><th>Constat</th><th>Source</th></tr>';
    h += '<tr><td>Flotte</td><td>' + TF.DATA.aircraft.fleet.map(function (f) { return f.reg + ' (MSN ' + f.msn + ')'; }).join(', ') + '</td><td style="font-size:11px">' + esc(TF.refText(TF.DATA.aircraft.fleetRef)) + '</td></tr>';
    TF.DATA.aircraft.facts.forEach(function (f) { h += '<tr><td>' + esc(f.k) + '</td><td>' + esc(f.v) + '</td><td style="font-size:11px">' + esc(TF.refText(f.ref)) + '</td></tr>'; });
    h += '</table><div class="sh-sec">Divergences documentaires (signalées, non résolues arbitrairement)</div><table class="t"><tr><th>#</th><th>Sujet</th><th>Écart</th><th>Application</th></tr>';
    TF.DATA.divergences.forEach(function (d) { h += '<tr><td>' + d.id + '</td><td>' + esc(d.topic) + '</td><td style="font-size:12px">' + esc(d.a.doc) + ' : ' + esc(d.a.text) + '<br>' + esc(d.b.doc) + ' : ' + esc(d.b.text) + '</td><td style="font-size:12px">' + esc(d.decision) + '</td></tr>'; });
    h += '</table><div class="sh-sec">À confirmer / données manquantes</div><table class="t"><tr><th>#</th><th>Besoin</th><th>Pourquoi</th></tr>';
    TF.DATA.toConfirm.forEach(function (c) { h += '<tr><td>' + c.id + '</td><td>' + esc(c.what) + '</td><td style="font-size:12px">' + esc(c.why) + '</td></tr>'; });
    h += '</table><div class="sh-sec">Traçabilité des étapes</div>';
    TF.DATA.procedures.forEach(function (pr) {
      h += '<div class="card"><b>' + esc(pr.fullTitle) + '</b><table class="t" style="margin-top:6px"><tr><th>#</th><th>Item</th><th>Réponse</th><th>Type</th><th>Source</th></tr>';
      pr.steps.forEach(function (s) { h += '<tr><td>' + esc(s.n) + '</td><td>' + esc(s.label) + (s.toConfirm ? ' <span class="toconfirm">' + s.toConfirm + '</span>' : '') + '</td><td>' + esc(s.response) + '</td><td>' + esc(s.kind) + '</td><td style="font-size:11px">' + esc(TF.refText(s.ref)) + '</td></tr>'; });
      h += '</table></div>';
    });
    h += '<p class="explain" style="margin-top:12px">Simplifications pédagogiques : durées d\'alignement AHRS, de préchauffage et d\'auto-test AFCS raccourcies ; valeurs moteur reprises des photos d\'écrans PDP ; carte, radios et pages G1000 non utilisées par les procédures non simulées (signalées à l\'écran). Version ' + TF.VERSION + '.</p>';
    K.sheet(h, null, { width: '1080px' });
  };
})(this);

</script>
<script>/* js/ui/app.js */
/* Démarrage de l'application : assemblage des modules A–F, boucle temps réel, barre d'outils. */
(function (root) {
  'use strict';
  var TF = root.TF, K = TF.UI, esc = TF.util.esc;

  function setVh() { document.documentElement.style.setProperty('--vh', (root.innerHeight * 0.01) + 'px'); }
  setVh(); root.addEventListener('resize', setVh);

  var scenario = TF.util.clone(TF.DATA.defaultScenario);
  try { var sv = root.localStorage && root.localStorage.getItem('tiffanir.scenario'); if (sv) { var o = JSON.parse(sv); for (var k in o) scenario[k] = o[k]; } } catch (e) { }

  var app = TF.app = {
    scenario: function () { return TF.util.clone(scenario); },
    setScenario: function (sc) {
      scenario = sc; try { root.localStorage.setItem('tiffanir.scenario', JSON.stringify(sc)); } catch (e) { }
      app.ck.s.scenario = TF.util.clone(sc); app.view.renderAll(); app.modes.render();
    }
  };
  app.ck = new TF.Cockpit(scenario);
  app.view = new TF.CockpitView(K.$('ck'), app.ck);
  app.modes = new TF.Session(app);
  app.ck.flightRate = function () { return app.modes.flightRate(); };
  app.checklistUI = new TF.ChecklistUI(app);
  TF.Interact.init(app);
  TF.Screens.init(app);

  /* Boucle temps réel (10 Hz) */
  var last = Date.now();
  setInterval(function () {
    var now = Date.now(), dt = Math.min(500, now - last); last = now;
    var sdt = dt * TF.Time.scale();               // temps simulé : accéléré seulement pendant les phases passives
    while (sdt > 250) { app.ck.update(250); sdt -= 250; }
    app.ck.tick(sdt); sysNotes(); if (app.modes.pollWindow) app.modes.pollWindow();
    var bd = K.$('timeBadge'), sc = TF.Time.scale(); if (bd) { bd.classList.toggle('hidden', sc <= 1); if (sc > 1) bd.textContent = '⏩ temps simulé ×' + sc + ' — les durées réelles sont plus longues'; }
  }, 100);

  /* Sons et notes système */
  app.ck.on('aural', function (k) { if (k === 'apdisc') K.sound.apdisc(); });
  var noteEl = K.$('sysNote');
  function sysNotes() {
    var I = app.ck.indications(), n = [];
    if (I.aural) K.sound.start('fire'); else K.sound.stop('fire');
    if (I.alerts.warnings.indexOf('CHECK GEAR') >= 0) K.sound.start('horn'); else K.sound.stop('horn');
    if (I.hydPump) n.push('🔊 Pompe hydraulique du train en fonctionnement (OM-B : 5 à 20 s) — durée pédagogique');
    if (I.pfdStage === 'align') n.push('AHRS ALIGN — durée raccourcie (pédagogique)');
    if (I.eng.L.glow || I.eng.R.glow) n.push('Préchauffage GLOW — durée pédagogique');
    if (I.ap.state === 'pft') n.push('Auto-test AFCS (PFT) — durée pédagogique');
    if (app.ck.s.eng.L.starterOverrun || app.ck.s.eng.R.starterOverrun) n.push('⚠ Démarreur maintenu > 10 s (OM-B CAUTION)');
    var txt = n.join(' · ');
    if (txt !== noteEl._t) { noteEl._t = txt; noteEl.textContent = txt; noteEl.classList.toggle('hidden', !txt); }
  }

  /* Barre d'outils cockpit (réduite à l'essentiel) */
  K.$('tbHome').onclick = function () { app.view.home(true); };
  /* Vitesse du temps simulé */
  function syncTime() { var b = K.$('tbTime'); if (b) b.textContent = TF.Time.modes[TF.Time.mode].label; }
  K.$('tbTime').onclick = function () { var o = ['express', 'normal', 'real'], m = o[(o.indexOf(TF.Time.mode) + 1) % 3]; TF.Time.set(m); syncTime();
    K.toast(m === 'express' ? '⏩ Express : attentes passives condensées (×8)' : m === 'normal' ? '▶ Normal : animations courtes (×3)' : '🕰 Réaliste : temps réel', '', 1600); };
  syncTime();
  /* Vues mémorisées + vue précédente (historique des cadrages) */
  (function () {
    var v = app.view, hist = [], orig = v.setView, back = false;
    v.setView = function (t, a) { if (!back && this.vb) { hist.push(TF.util.clone(this.vb)); if (hist.length > 15) hist.shift(); } return orig.call(this, t, a); };
    v.backView = function () { var p = hist.pop(); if (!p) return false; back = true; orig.call(v, p, true); back = false; return true; };
    var VIEWS = [['Vue générale', null], ['Panneau gauche', 'leftSub'], ['PFD', 'pfd'], ['MFD + pilote automatique', 'mfd'], ['Partie supérieure', { x: 300, y: 285, w: 960, h: 115 }], ['Partie inférieure', { x: 300, y: 630, w: 1060, h: 90 }], ['Console centrale', 'console'], ['Commandes moteurs', { x: 640, y: 880, w: 260, h: 250 }], ['Sélecteurs carburant', 'fuelsel']];
    K.$('tbViews').onclick = function (e) {
      var h = '<div class="viewpop"><b>Vues</b>' + VIEWS.map(function (x, i) { return '<button class="btn" data-act="vw" data-i="' + i + '">' + x[0] + '</button>'; }).join('') + '<button class="btn" data-act="vback">↶ Vue précédente</button></div>';
      K.popover(h, { x: e.clientX, y: e.clientY }, function (p) {
        K.bindActs(p, {
          vw: function (el) { var x = VIEWS[+el.getAttribute('data-i')][1]; K.closePopover(); if (!x) return v.home(true); var r = typeof x === 'string' ? TF.DATA.regions.filter(function (q) { return q.id === x; })[0] : x; if (r) v.setView(r, true); },
          vback: function () { K.closePopover(); if (!v.backView()) K.toast('Pas de vue précédente', '', 1200); }
        });
      });
    };
    function imm(on) { document.body.classList.toggle('immersion', on); setTimeout(function () { v.resize(); }, 60); }
    K.$('tbImm').onclick = function () { imm(!document.body.classList.contains('immersion')); };
    K.$('immExit').onclick = function () { imm(false); };
  })();
  K.$('tbLook').onclick = function () { app.modes.armLook(); };
  K.$('tbCallout').onclick = function () { if (TF.Ess.onCallout && TF.Ess.onCallout()) return; TF.Interact.declareCallout(); };
  K.$('tbRate').onclick = function () { app.modes.cycleRate(); };
  K.$('tbVerif').onclick = function () { TF.Interact.openDeclaratives(); };
  K.$('tbHint').onclick = function () { app.modes.hint(); };
  K.$('tbStop').onclick = function () { if (app.modes.level === 'discover' && app.modes.phase) { if (!app.modes.paused) app.modes.togglePause(); } else TF.Voice.stop(); };

  /* Barre supérieure */
  K.$('btnHome').onclick = function () { TF.Voice.stop(); K.closeSheet(); if (TF.Ess.active()) TF.Ess.stop(true); app.modes.idle(); TF.Ess.show(); };
  K.$('btnEss').onclick = function () { TF.Voice.stop(); K.closeSheet(); if (TF.Ess.active()) TF.Ess.stop(true); TF.Ess.close(); app.modes.idle(); TF.Home.show(); };
  K.$('btnProfile').onclick = function () { TF.Screens.profile(); };
  K.$('btnBrand').onclick = function () { TF.Screens.splash(function () { app.onProfile(); }); };
  K.$('btnLabels').onclick = function () { var on = !app.view.showLabels; app.view.setLabels(on); this.classList.toggle('on', on); var p = TF.Profiles.current(); if (p) TF.Profiles.setSetting('showLabels', on); };
  /* Son : fort → faible → coupé (moteurs, clics, alarmes, voix) */
  K.$('btnSound').onclick = function () {
    var st = !K.sound.enabled() ? 'off' : K.sound.volume() < 0.6 ? 'low' : 'high', nx = st === 'high' ? 'low' : st === 'low' ? 'off' : 'high', on = nx !== 'off';
    K.sound.setEnabled(on); K.sound.setVolume(nx === 'low' ? 0.35 : 1); TF.Voice.setEnabled(on); this.classList.toggle('on', on); this.textContent = nx === 'high' ? '🔊' : nx === 'low' ? '🔉' : '🔇';
    K.toast(nx === 'high' ? 'Son fort' : nx === 'low' ? 'Son faible' : 'Son coupé', '', 900);
    var p = TF.Profiles.current(); if (p) { TF.Profiles.setSetting('sound', on); TF.Profiles.setSetting('voice', on); }
  };
  K.$('btnFull').onclick = function () {
    var d = document, de = d.documentElement;
    var fs = d.fullscreenElement || d.webkitFullscreenElement;
    if (fs) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    try { if (req) req.call(de); else throw 0; } catch (e) { K.toast('Sur iPad : Partager → « Sur l\'écran d\'accueil » pour un plein écran sans menus.', 'warn', 4500); }
  };
  K.$('instrToggle').onclick = function () { K.$('instructor').classList.toggle('collapsed'); setTimeout(function () { app.view.resize(); }, 280); };
  K.$('sheetWrap').addEventListener('click', function (e) { if (e.target === K.$('sheetWrap')) { TF.Voice.stop(); K.closeSheet(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (K.sheetOpen()) K.closeSheet(); else K.closePopover(); }
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'h') app.view.home(true);
    if (e.key === 'n') K.$('btnLabels').click();
    if (e.key === 'a' || e.key === ' ') { e.preventDefault(); TF.Interact.declareCallout(); }
    if (e.key === 'c') app.modes.armLook();
    if (e.key === 'i') app.modes.hint();
  });

  app.onProfile = function () {
    var p = TF.Profiles.current(); if (!p) return;
    K.$('profileName').textContent = p.name;
    app.view.setLabels(!!p.settings.showLabels); K.$('btnLabels').classList.toggle('on', !!p.settings.showLabels);
    K.sound.setEnabled(p.settings.sound !== false); K.$('btnSound').classList.toggle('on', p.settings.sound !== false);
    TF.Voice.setEnabled(p.settings.voice !== false);
    app.modes.idle(); TF.Ess.show();
  };

  /* Accueil */
  TF.Board.init();
  if (TF.Ifr) TF.Ifr.init();
  TF.MiniMap.init(); setInterval(function () { TF.MiniMap.update(); }, 250);
  TF.Screens.splash(function () { app.onProfile(); app.view.resize(); app.view.home(false); });
  app.modes.render();
  app.modes.setChip();

  /* Hors connexion : service worker si servi en http(s) */
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    // Mise à jour : on vérifie à chaque ouverture (et au retour sur l'appli) ; la nouvelle version s'installe puis la page se recharge une fois.
    var hadCtrl = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      try { reg.update(); } catch (e) { }
      document.addEventListener('visibilitychange', function () { if (!document.hidden) { try { reg.update(); } catch (e) { } } });
    }).catch(function () { });
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadCtrl || reloaded) return; reloaded = true;
      var busy = app.modes.phase && app.modes.mode !== 'done';
      if (busy) K.toast('🔄 Nouvelle version disponible : elle sera active à la prochaine ouverture.', '', 4000);
      else location.reload();
    });
  }
})(this);

</script>
</body>
</html>
