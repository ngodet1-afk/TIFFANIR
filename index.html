/* TIFFAN'IR (ME) — interface. Compatible Safari 12 : pas de gap en flex, pas de inset, préfixes -webkit-. */

/* ---------- Barre supérieure ---------- */

/* ---------- Zone principale ---------- */

#stage { -webkit-flex: 1; flex: 1; position: relative; overflow: hidden; background: #050608; }

#instructor { width: 25%; max-width: 420px; min-width: 280px; -webkit-flex: 0 0 auto; flex: 0 0 auto; background: linear-gradient(180deg, #0c1524, #0a111d); border-left: 1px solid #1b2a40; position: relative; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; transition: width .25s, min-width .25s; z-index: 5; }

#toast { position: absolute; left: 50%; top: 14px; -webkit-transform: translateX(-50%); transform: translateX(-50%); max-width: 80%; z-index: 20; pointer-events: none; }
.toast-item { margin-bottom: 8px; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; background: rgba(12, 22, 38, .95); border: 1px solid #2a4570; box-shadow: 0 8px 26px rgba(0,0,0,.45); text-align: center; -webkit-animation: tin .2s ease-out; animation: tin .2s ease-out; }
.toast-item.ok { border-color: #1f8a4c; color: #c8ffe0; } .toast-item.err { border-color: #a32a2e; color: #ffd4d6; background: rgba(40, 10, 14, .95); } .toast-item.warn { border-color: #8a6a1a; color: #ffeab0; }

/* ---------- Popover (sélecteurs, observations) ---------- */
#popover { position: absolute; z-index: 25; min-width: 230px; max-width: 340px; background: rgba(10, 18, 31, .97); border: 1px solid #2a4570; border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.6); padding: 12px; }

/* ---------- Mise en évidence SVG ---------- */
.hl { fill: none; stroke: #3fe0e8; stroke-width: 1.6; }

.b-set { background: #123a5a; color: #bfe0ff; } .b-press { background: #3a2a12; color: #ffe0b0; } .b-observe { background: #123a2a; color: #c0ffd8; }
.b-confirm { background: #2a1a3a; color: #e8d0ff; } .b-callout { background: #3a1230; color: #ffd0f0; } .b-achieve { background: #12303a; color: #c8f6ff; } .b-briefing { background: #3a3012; color: #fff0c0; } .b-constraint { background: #2a2a2a; color: #ddd; }
.explain { color: #c8d4e4; font-size: 13.5px; line-height: 1.4; margin-top: 6px; }

.feedback.err { background: #2a0e12; border: 1px solid #7a2a30; color: #ffd4d6; }

.btn { display: inline-block; padding: 10px 14px; border-radius: 11px; background: #13213a; border: 1px solid #23385a; font-weight: 700; margin: 0 6px 6px 0; font-size: 13.5px; }
.btn.primary { background: linear-gradient(180deg, #17a6b3, #0f7c88); border-color: #22c6d4; color: #fff; }

/* ---------- Feuilles modales ---------- */

.s-ok { color: var(--ok); } .s-aid { color: #9be7ff; } .s-err { color: var(--err); } .s-om { color: var(--warn); } .s-na { color: #5c6f8a; }

  /* ---------- Bus d'événements minimal ---------- */
  function Emitter() { this._h = {}; }
  Emitter.prototype.on = function (name, fn) {
    (this._h[name] = this._h[name] || []).push(fn);
    var self = this;
    return function () { self.off(name, fn); };
  };
  Emitter.prototype.off = function (name, fn) {
    var l = this._h[name]; if (!l) return;
    var i = l.indexOf(fn); if (i >= 0) l.splice(i, 1);
  };
  Emitter.prototype.emit = function (name, a, b, c) {
    var l = this._h[name]; if (!l) return;
    l = l.slice();
    for (var i = 0; i < l.length; i++) {
      try { l[i](a, b, c); } catch (e) { if (root.console) console.error('[TF] handler ' + name, e); }

    });
  };
  U.indexBy = function (arr, key) {
    var o = {}; for (var i = 0; i < arr.length; i++) o[arr[i][key]] = arr[i]; return o;
  };

  };

  };

  /* Plus longue sous-séquence croissante : renvoie les indices (dans arr) qui la composent. */
  U.lisIndices = function (arr) {
    var n = arr.length, tails = [], prev = new Array(n), tailIdx = [];
    for (var i = 0; i < n; i++) {
      var lo = 0, hi = tails.length;
      while (lo < hi) { var mid = (lo + hi) >> 1; if (tails[mid] <= arr[i]) lo = mid + 1; else hi = mid; }

    }
    var res = [], k = tailIdx[tails.length - 1];
    while (k !== undefined && k >= 0) { res.unshift(k); k = prev[k]; }
    return res;
  };

<script>/* js/model/g1000.js */
/* B. MODÈLE — G1000 NXi (sous-ensemble utile aux procédures) et contexte de vol scénarisé.
 * Comportements tirés du Garmin G1000 NXi Pilot's Guide DA42NG (190-02237-00 Rev. A) :
 *  - boutons COM / NAV / HDG / ALT SEL / CRS-BARO / FMS : p.5-6
 *  - transfert COM, maintien 2 s → 121.500 : p.5 (et PDP « Selecting emergency frequency »)
 *  - softkeys PFD Opt → STD Baro : p.23 et p.52 ; transpondeur XPDR / CODE : p.118
 *  - activation du directeur de vol / modes AFCS (ROL, PIT, HDG, ALT, VS, FLC, NAV, APR, ALTS) : p.388-393
 * Le « vol » n'est pas un modèle de vol : c'est une situation scénarisée (vitesse, altitude, cap) qui sert
 * de déclencheur aux annonces et actions. Elle est signalée comme telle à l'écran.
 */
(function (root) {
  'use strict';
  var TF = root.TF, U = TF.util;
  var G = TF.G1000 = {};

  G.REF = {
    knobs: { doc: 'G1000', sec: 'PFD/MFD controls', page: 5 },
    altsel: { doc: 'G1000', sec: 'ALT SEL knob', page: 6 },
    stdbaro: { doc: 'G1000', sec: 'Selecting standard barometric pressure', page: 52 },
    xpdr: { doc: 'G1000', sec: 'Transponder controls', page: 118 },
    afcs: { doc: 'G1000', sec: 'Flight Director activation (Table 7-1)', page: 388 },
    alts: { doc: 'G1000', sec: 'Selected Altitude Capture mode (ALTS)', page: 393 },
    fuel: { doc: 'G1000', sec: 'EIS softkeys DEC/INC/RST Fuel', page: 24 }
  };

  G.initial = function () {
    return {
      com: [{ a: 123150, s: 124050 }, { a: 121500, s: 118080 }], comSel: 0,
      nav: [{ a: 114500, s: 109350 }, { a: 114500, s: 109350 }], navSel: 0,
      hdg: 8, altSel: 1400, baro: 1013, std: false, crs: 44, cdi: 'GPS',
      xpdr: { code: '7000', mode: 'STBY', level: 0, entry: '' }, pfdLevel: 'top', inset: true, tmrRef: true, meters: false, baroUnit: 'HPA',
      fd: false, yd: false, lat: '', vert: '', latArm: '', vertArm: '', refVs: 0, refIas: 0, refAlt: null,
      // Clignotements AFCS (Garmin p.390, 393, 415) : instant de la dernière transition automatique
      latAt: null, vertAt: null, latArmAt: null, ydDiscAt: null
    };
  };
  /* Position de l'avion pour la mini-carte (mètres, repère local : origine seuil 10 de LFBU, x vers l'est, y vers le nord).
     Piste 10/28 : 1 860 m, QFU 097° vrai (AIP France AD 2 LFBU). Parking et taxiways : SCHÉMATIQUES (non à l'échelle). */
  var RAD = Math.PI / 180;
  /* Plateforme d'après l'AIP France AD 2 LFBU GMC 01 (09 JUL 2026), APDC 01 et ATT 01 : taxiways SUD de la piste.
     rp(d, s) : point à d m du seuil 10 le long de l'axe (097° vrai) et s m au SUD de l'axe. Positions lues sur les cartes (≈ ± 30 m). */
  function rp(d, s) { return [Math.round(d * Math.sin(97 * RAD) + s * Math.sin(187 * RAD)), Math.round(d * Math.cos(97 * RAD) + s * Math.cos(187 * RAD))]; }
  G.rp = rp;
  G.LFBU = { rwyLen: 1860, rwyTrue: 97, thr28: [1860 * Math.sin(97 * RAD), 1860 * Math.cos(97 * RAD)], lineUp: [30, -4],
    // aire de trafic (bande grise) : D (Airbus, à l'ouest) → A → C (à l'est)
    apron: [rp(640, 250), rp(1000, 250), rp(1000, 330), rp(640, 330)],
    park: rp(720, 280), parkName: 'Pkg Airbus (aire D)',
    twys: [
      { n: 'F', pts: [rp(940, 235), rp(690, 235)], oneway: true },   // sens unique vers l'ouest (sortie aires A et D)
      { n: 'W', pts: [rp(690, 300), rp(690, 0)] },                    // partie sud à sens unique vers la piste
      { n: 'G', pts: [rp(690, 160), rp(975, 160)], oneway: true },    // sens unique vers l'est
      { n: 'M', pts: [rp(975, 270), rp(975, 0)] },
      { n: 'E1', pts: [rp(975, 160), rp(1310, 160)] },
      { n: 'E', pts: [rp(1310, 160), rp(1310, 0)] }
    ],
    holds: [{ n: 'W', p: rp(690, 65) }, { n: 'M', p: rp(975, 65) }, { n: 'E', p: rp(1310, 65) }],
    // itinéraire de départ piste 28 depuis le Pkg Airbus : F (sens unique) → W (partie sud) → G (sens unique) → E1 → E → point d'arrêt E
    taxi: [rp(720, 280), rp(720, 235), rp(690, 235), rp(690, 160), rp(975, 160), rp(1310, 160), rp(1310, 65)],
    route: 'Pkg Airbus → F → W → G → E1 → E (point d\'arrêt E, piste 28)' };
  (function () { var P = G.LFBU.taxi, c = [0], L = 0; for (var i = 1; i < P.length; i++) { L += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); c.push(L); } G.LFBU.taxiPos = c.map(function (v) { return v / L; }); G.LFBU.taxiLen = L; })();
  G.taxiPoint = function (pos) {
    var L = G.LFBU, P = L.taxi, T = L.taxiPos, k = 0; pos = U.clamp(pos, 0, 1);
    while (k < T.length - 2 && pos > T[k + 1]) k++;
    var r = (pos - T[k]) / (T[k + 1] - T[k]);
    return [P[k][0] + (P[k + 1][0] - P[k][0]) * r, P[k][1] + (P[k + 1][1] - P[k][1]) * r];
  };
  G.flightInitial = function () { return { onGround: true, ias: 0, alt: 420, vs: 0, hdg: 7, turn: 0, slip: 0, pos: 0, script: null, scriptT: 0, label: '', mx: G.LFBU.park[0], my: G.LFBU.park[1], trail: [] }; };
  function moveMap(f, dt) {
    if (f.mx == null) { f.mx = G.LFBU.park[0]; f.my = G.LFBU.park[1]; }
    var d = f.ias * 0.5144 * dt / 1000;
    f.mx += Math.sin(f.hdg * RAD) * d; f.my += Math.cos(f.hdg * RAD) * d;
    pushTrail(f);
  }
  function pushTrail(f) {
    if (!f.trail) f.trail = [];
    var l = f.trail[f.trail.length - 1];
    if (!l || Math.abs(l[0] - f.mx) + Math.abs(l[1] - f.my) > (f.onGround ? 15 : 250)) { f.trail.push([Math.round(f.mx), Math.round(f.my)]); if (f.trail.length > 160) f.trail.shift(); }
  }

  function fmtFreq(k, dec) { var s = (k / 1000).toFixed(3); return dec === 2 ? s.slice(0, -1) : s; }
  G.fmtCom = function (k) { return fmtFreq(k, 3); };
  G.fmtNav = function (k) { return fmtFreq(k, 2); };
  function wrap(v, lo, hi) { var r = hi - lo + 1; while (v < lo) v += r; while (v > hi) v -= r; return v; }

  /* Action sur un bouton rotatif : act = 'L+','L-','S+','S-','push' */
  G.knob = function (ck, id, act) {
    var g = ck.s.g, f = ck.s.flight;
    var d = ck.defs[id], k = d && d.knob;
    if (!ck.s.sys.power) return { ok: false, reason: 'G1000 non alimenté (ELECT MASTER OFF).' };
    var big = act[0] === 'L', dir = act[1] === '+' ? 1 : -1;
    if (k === 'com') {
      var c = g.com[g.comSel];
      if (act === 'push') { g.comSel = 1 - g.comSel; return { ok: true, msg: 'Boîte de réglage cyan sur COM' + (g.comSel + 1) }; }
      var mhz = Math.floor(c.s / 1000), khz = c.s % 1000;
      if (big) mhz = wrap(mhz + dir, 118, 136); else khz = wrap(khz + dir * 25, 0, 975);
      c.s = mhz * 1000 + khz;
    } else if (k === 'nav') {
      var n = g.nav[g.navSel];
      if (act === 'push') { g.navSel = 1 - g.navSel; return { ok: true, msg: 'Boîte de réglage cyan sur NAV' + (g.navSel + 1) }; }
      var m2 = Math.floor(n.s / 1000), k2 = n.s % 1000;
      if (big) m2 = wrap(m2 + dir, 108, 117); else k2 = wrap(k2 + dir * 50, 0, 950);
      n.s = m2 * 1000 + k2;
    } else if (k === 'hdg') {
      if (act === 'push') g.hdg = Math.round(f.hdg);
      else g.hdg = wrap(g.hdg + dir * (big ? 10 : 1), 1, 360);
    } else if (k === 'alt') {
      if (act === 'push') return { ok: true };
      g.altSel = U.clamp(g.altSel + dir * (big ? 1000 : 100), -1000, 30000);
      if (g.vert === 'ALTS') { g.vert = 'PIT'; g.vertArm = 'ALTS'; }

/* B. MODÈLE COCKPIT — état, transitions, indications dérivées.

      if (I.ap.state === 'ready') item('pfd.ap', 'Bandeau AFCS', [av.latArm ? av.latArm + ' (blanc, armé)' : '', av.lat ? av.lat + (av.latFlash ? ' (vert, clignote)' : ' (vert)') : '',

    if (zone === 'flap_lights') {

      return out;
    }
    if (zone === 'deice_lights') {

    }
    if (zone === 'cb_panel' || zone === 'cb_bottom') {

  /* Séquence de test ECU (OM-B p.62) : 2 × (montée > 1800 / descente) par canal, ~12 s au total (durée pédagogique) */
  function ecuRpm(e, t) {
    if (!e.ecu || e.ecu.start == null || e.ecu.done) return 0;
    var x = (t - e.ecu.start) / 1500, ph = Math.floor(x) % 2;
    return ph === 0 ? Math.round(710 + 1150 * Math.sin((x % 1) * Math.PI)) : 710 + Math.round(200 * (1 - (x % 1)));
  }

<script>/* js/engine/conditions.js */
/* C. MOTEUR DE PROCÉDURES — registre des conditions nommées.

  'use strict';

  function run(S, k) { return S.eng[k].state === 'run'; }
  function rpm(S, k) { var pl = S.controls[k === 'L' ? 'power_l' : 'power_r']; return Math.round(TF.DATA.displayValues.idle.rpm[k === 'L' ? 0 : 1] + pl * 15.9); }

  var C = TF.Conditions = {

    fmsMatchesGauge: function (S) { return Math.abs(S.sys.fmsFuel - (S.scenario.fuelMain[0] + S.scenario.fuelMain[1])) < 0.6; },
    annunTestDone: function (S) { return S.sys.history.annunTest && S.controls.deice_annun === 'OFF'; },
    fireTested: function (S) { return S.sys.history.fireTest; },
    engRunL: function (S) { return run(S, 'L'); },
    engRunR: function (S) { return run(S, 'R'); },
    glowOffL: function (S) { return S.t >= S.eng.L.glowUntil; },
    glowOffR: function (S) { return S.t >= S.eng.R.glowUntil; },
    powerMax50: function (S) { return S.controls.power_l <= 50 && S.controls.power_r <= 50; },
    crossfeedTested: function (S) { return S.sys.history.crossfeed; },
    floodTested: function (S) { return S.controls.flood_light > 0.05 || S.sys.history.flood === true; },

    apReady: function (S) { return S.sys.apState === 'ready'; },
    apEngaged: function (S) { return S.sys.history.apEngaged; },
    apDiscTested: function (S) { return S.sys.history.apDisc; },
    apTested: function (S) { return S.sys.history.apEngaged && S.sys.history.apDisc; },
    dbChecked: function (S) { return S.sys.history.dbChecked; },
    startersOff: function (S) { return S.controls.start_key !== 'START L' && S.controls.start_key !== 'START R'; },
    oilOkBoth: function (S) { return run(S, 'L') && run(S, 'R') && (S.t - S.eng.L.runSince) > TF.DATA.timing.oilRise && (S.t - S.eng.R.runSince) > TF.DATA.timing.oilRise; },
    elecCharging: function (S) { return (run(S, 'L') && S.controls.alt_l === 'ON') || (run(S, 'R') && S.controls.alt_r === 'ON'); },
    idleRpmBoth: function (S) { return run(S, 'L') && run(S, 'R') && Math.abs(rpm(S, 'L') - 710) <= 30 && Math.abs(rpm(S, 'R') - 710) <= 30; },
    enginesRunning: function (S) { return run(S, 'L') && run(S, 'R'); },

    /* --- Phases de vol --- */
    rpmBelow1000L: function (I) { return I.eng.L.running && I.eng.L.rpm < 1000; },
    rpmBelow1000R: function (I) { return I.eng.R.running && I.eng.R.rpm < 1000; },
    gearbox40L: function (I) { return I.eng.L.running && I.eng.L.gearbox >= 40; },
    gearbox40R: function (I) { return I.eng.R.running && I.eng.R.gearbox >= 40; },
    ecuTestL: function (S) { return S.sys.history.ecuTestL; },
    ecuTestR: function (S) { return S.sys.history.ecuTestR; },
    ecuTestBoth: function (S) { return S.sys.history.ecuTestL && S.sys.history.ecuTestR; },
    voterTestL: function (S) { var h = S.sys.history.voterL; return h.indexOf('ECU A') >= 0 && h.indexOf('ECU B') >= 0 && S.controls.voter_l === 'AUTO'; },
    voterTestR: function (S) { var h = S.sys.history.voterR; return h.indexOf('ECU A') >= 0 && h.indexOf('ECU B') >= 0 && S.controls.voter_r === 'AUTO'; },
    voterTestBoth: function (S) { return C.voterTestL(S) && C.voterTestR(S); },
    flapsCycled: function (S) { return S.sys.history.flapsCycled && S.controls.flaps === 'UP'; },
    altimeterQnh: function (S) { return S.g.baro === (S.scenario.qnh || 1013) && !S.g.std; },
    altimeterDest: function (S) { return S.g.baro === S.scenario.qnhDest && !S.g.std; },
    powerIdleBoth: function (S) { return S.controls.power_l <= 3 && S.controls.power_r <= 3; },
    power70Both: function (S) { return Math.abs(S.controls.power_l - 70) <= 6 && Math.abs(S.controls.power_r - 70) <= 6; },
    powerMaxBoth: function (S) { return S.controls.power_l >= 97 && S.controls.power_r >= 97; },
    power92Both: function (S) { return Math.abs(S.controls.power_l - 92) <= 3 && Math.abs(S.controls.power_r - 92) <= 3; },
    powerCruise: function (S) { return S.controls.power_l >= 60 && S.controls.power_l <= 92 && S.controls.power_r >= 60 && S.controls.power_r <= 92; },
    rollStarted: function (S) { return S.flight.ias > 0 || S.flight.script; },
    speedAlive: function (S) { return S.flight.ias >= 15 && S.flight.ias < 60; },
    turningRight: function (S) { return S.flight.onGround && (S.flight.turn || 0) > 0.5; },
    turningLeft: function (S) { return S.flight.onGround && (S.flight.turn || 0) < -0.5; },
    atHoldingPoint: function (S) { return !S.flight.script && (S.flight.pos || 0) >= 0.99 && S.flight.ias < 0.5; },
    speedAlivePfd: function (S) { return S.flight.ias >= 20 && S.flight.ias < 60; },

    ias60: function (S) { return S.flight.ias >= 54 && S.flight.ias < 70; },
    atVr: function (S) { return S.flight.ias >= 72 && S.flight.ias <= 84; },
    posClimb: function (S) { return !S.flight.onGround && S.flight.vs > 100; },
    alt400: function (S) { return !S.flight.onGround && S.flight.alt >= 820; },
    altHold2500: function (S) { return S.g.vert === 'ALT' && Math.abs(S.flight.alt - 2500) < 30; },
    altHold2000: function (S) { return S.g.vert === 'ALT' && Math.abs(S.flight.alt - 2000) < 30; },
    ias86: function (S) { return !S.flight.onGround && S.flight.ias >= 86; },
    gIas20: function (S) { return S.flight.ias >= 20; },
    gIas30: function (S) { return S.flight.ias >= 30; },
    gIas60: function (S) { return S.flight.ias >= 60; },
    gIas76: function (S) { return S.flight.ias >= 76; },
    gPitch: function (S) { return !S.flight.onGround && (S.flight.pitch || 0) >= 11; },
    gPosClimb: function (S) { return !S.flight.onGround && S.flight.vs > 100 && S.flight.alt >= 440; },
    airborne: function (S) { return !S.flight.onGround; },
    ias91: function (S) { return !S.flight.onGround && S.flight.ias >= 91; },
    aboveTosaIfr: function (S) { return !S.flight.onGround && S.flight.alt >= 1920; }, // TOSA IFR 1 500 ft sol (LFBU ≈ 420 ft)
    altSelFirst: function (S) { return S.g.altSel === S.scenario.firstAlt; },
    altSel2000: function (S) { return S.g.altSel === 2000; },
    missedAltSet: function (S) { return S.g.altSel === S.scenario.missedAlt; },
    flcActive: function (S) { return S.g.vert === 'FLC'; },
    vsActive: function (S) { return S.g.vert === 'VS'; },
    vsMinus500: function (S) { return S.g.vert === 'VS' && S.g.refVs === -500; },
    stdSet: function (S) { return S.g.std; },
    comStbyChanged: function (S) { return S.g.com[0].s !== 124050 || S.g.com[0].a !== 123150; },
    hundredAbove: function (S) { var a = S.flight.alt - S.scenario.minima; return a >= 60 && a <= 140; },
    atMinima: function (S) { return Math.abs(S.flight.alt - S.scenario.minima) <= 40; },
    cooldownDone: function (S) { return S.sys.history.cooldownMs >= 8000; },
    elecAfterWait: function (S) { var h = S.sys.history; return !(h.elecOffAt != null && h.mastersOffAt != null && h.elecOffAt - h.mastersOffAt < 15000); },
    pumpsOnBoth: function (S) { return S.controls.fuel_pump_l === 'ON' && S.controls.fuel_pump_r === 'ON'; },
    pumpsOffBoth: function (S) { return S.controls.fuel_pump_l === 'OFF' && S.controls.fuel_pump_r === 'OFF'; },
    fuelSelOnBoth: function (S) { return S.controls.fuel_sel_l === 'ON' && S.controls.fuel_sel_r === 'ON'; },
    gearFlapsUp: function (S) { return S.controls.gear_lever === 'UP' && S.controls.flaps === 'UP'; },
    apOff: function (S) { return !S.sys.apEngaged; },
    mastersOff: function (S) { return S.controls.eng_master_l === 'OFF' && S.controls.eng_master_r === 'OFF'; },
    fuelBalanced: function (S) { return Math.abs(S.scenario.fuelMain[0] - S.scenario.fuelMain[1]) <= 5; },

    /* Contrôles qualité d'une étape (renvoient un message d'erreur ou null) */
    startAfterGlowL: function (S) { return S.eng.L.startedDuringGlow ? 'Démarreur engagé avant l\'extinction de « L GLOW »' : (S.eng.L.starterOverrun ? 'Démarreur maintenu plus de 10 s' : null); },

    /* Attentes sur une observation (I = indications au moment de l'observation) */
    starterOffL: function (I) { return !I.eng.L.starter; },
    starterOffR: function (I) { return !I.eng.R.starter; },
    oilOkL: function (I) { return I.eng.L.running && I.eng.L.oilP > 1; },

<script>/* js/engine/procedures.js */
/* C. MOTEUR DE PROCÉDURES — enregistrement d'une tentative, évaluation, exécution idéale.
 * Pur JavaScript, sans DOM (tests Node : tests/run-tests.js).
 */
(function (root) {
  'use strict';
  var TF = root.TF, U = TF.util;
  var NEUTRAL_TYPES = { softkey: 1, knob: 1 };
  var NEUTRAL_IDS = { mfd_ent: 1, mfd_clr: 1, xfer_com: 1, xfer_nav: 1, mxfer_nav: 1 };
  function sameVal(a, b) { return typeof b === 'number' ? Math.abs(+a - b) <= 3 : a === b; }

  function procById(id) { for (var i = 0; i < TF.DATA.procedures.length; i++) if (TF.DATA.procedures[i].id === id) return TF.DATA.procedures[i]; return null; }
  function stepById(proc, id) { for (var i = 0; i < proc.steps.length; i++) if (proc.steps[i].id === id) return proc.steps[i]; return null; }
  function inter(a, b) { if (!a || !b) return false; for (var i = 0; i < a.length; i++) if (b.indexOf(a[i]) >= 0) return true; return false; }
  function stepCtls(step) { var l = []; if (step.ctl) l.push(step.ctl); if (step.ctls) l = l.concat(step.ctls); return l; }
  function procCtls(proc) { var o = {}; proc.steps.forEach(function (s) { stepCtls(s).forEach(function (c) { o[c] = 1; }); }); return o; }
  function zoneOfObs(id) { var z = id.split('.')[0]; return z === 'gear' ? 'gear_lights' : z === 'flap' ? 'flap_lights' : z; }

  /* ------------------------------------------------------------------ */
  /* Correspondance événement ↔ étape                                    */
  /* ------------------------------------------------------------------ */
  function matches(step, ev) {
    switch (step.kind) {
      case 'set': return ev.type === 'set' && ev.ctl === step.ctl && ev.to === step.pos;
      case 'look': return ev.type === 'look' && ev.ctl === step.ctl && sameVal(ev.value, step.pos);
      case 'press': return ev.type === 'press' && ev.ctl === step.ctl && ev.dur >= (step.minDur || 0) && (!step.needPower || (ev.ctx && ev.ctx.power));
      case 'observe': return ev.type === 'observe' && ev.valid !== false && inter(ev.obs, step.obs) &&
        (!step.expect || (ev.I && TF.Conditions[step.expect](ev.I)));
      case 'confirm': return ev.type === 'confirm' && ev.item === step.item;
      case 'briefing': return ev.type === 'briefing' && ev.briefing === step.briefing;
      case 'achieve':
        if (!ev.S) return false;
        var related = (ev.ctl && step.ctls && step.ctls.indexOf(ev.ctl) >= 0 && ev.type !== 'look') || (ev.type === 'look' && step.ctls && step.ctls.indexOf(ev.ctl) >= 0) ||
          (ev.type === 'observe' && inter(ev.obs, step.obs)) || (ev.type === 'state' && ev.cond === step.cond);
        return related && TF.evalCond(step.cond, ev.S);
      default: return false;
    }
  }
  TF.stepMatches = matches;

  /* ------------------------------------------------------------------ */
  /* Évaluation complète d'une tentative                                 */
  /* ------------------------------------------------------------------ */
  function evaluate(proc, events, S0, Sf, opts) {
    opts = opts || {};
    var sc = S0.scenario, res = { proc: proc.id, steps: [], extraneous: [], critical: [], orderRemarks: [], callouts: [] };
    var M = {}; // stepId -> {idx}
    var calloutEvents = events.filter(function (e) { return e.type === 'callout'; });
    var ci = 0;
    proc.steps.forEach(function (st) {
      var r = { id: st.id, step: st, status: 'omitted', idx: -1, aids: 0, notes: [] };
      var req = TF.isRequired(st, sc);
      events.forEach(function (e) { if (e.type === 'hint' && e.stepId === st.id) r.aids = Math.max(r.aids, e.level || 1); });
      if (st.kind === 'callout') {
        var ev = calloutEvents[ci];
        if (ev) {
          r.status = 'ok'; r.idx = ev.i; ci++; r.selfEval = ev.selfEval;
          if (st.when && ev.S && !TF.evalCond(st.when, ev.S)) { r.status = 'invalid'; r.notes.push('Annonce hors de sa fenêtre (situation : ' + Math.round(ev.S.flight.ias) + ' kt, ' + Math.round(ev.S.flight.alt) + ' ft)'); }
        }
        M[st.id] = r; res.steps.push(r); return;
      }
      if (st.kind === 'constraint') {
        var viol = events.some(function (e) { return e.S && !TF.evalCond(st.cond, e.S); }) || !TF.evalCond(st.cond, Sf);
        r.status = viol ? 'wrong' : 'ok'; if (viol) r.notes.push('Limite non respectée');
        r.constraint = true; M[st.id] = r; res.steps.push(r); return;
      }
      var minIdx = -1, depsOk = true;
      (st.after || []).forEach(function (d) { var m = M[d]; if (m && m.idx >= 0) minIdx = Math.max(minIdx, m.idx); });
      var found = -1, anyFound = -1;
      for (var i = 0; i < events.length; i++) {
        if (matches(st, events[i])) { if (anyFound < 0) anyFound = i; if (i > minIdx) { found = i; break; } }
      }
      if (found >= 0) { r.status = 'ok'; r.idx = events[found].i; }
      else if (anyFound >= 0) { r.status = 'order'; r.idx = events[anyFound].i; r.notes.push('Réalisée avant une étape prescrite au préalable (' + (st.after || []).join(', ') + ')'); }
      // Contrôle qualité (ex. démarreur pendant le GLOW)
      if (r.idx >= 0 && st.check) {
        var evm = events[r.idx]; var msg = TF.Conditions[st.check](evm.S || Sf);
        if (!msg) msg = TF.Conditions[st.check](Sf);
        if (msg) { r.status = 'invalid'; r.notes.push(msg); }
      }
      // Position finale (dernière étape « set » portant sur la commande)

        def = this.c.defs[v.ctl];
        var cur = S.controls[v.ctl];
        return { kind: 'state', conform: cur === v.expect, seen: def.label + ' : ' + cur, ctl: v.ctl };
      case 'cond':
        var okc = TF.evalCond(v.cond, S);
        return { kind: 'indication', conform: okc, seen: v.what + (okc ? ' — conforme' : ' — NON conforme'), zone: v.zone };
      case 'history':
        var okh = TF.evalCond(v.cond, S);
        return { kind: 'history', conform: okh, seen: v.what + (okh ? ' : effectué' : ' : NON effectué'), ctl: v.ctl, zone: v.zone };
      case 'asRequired':
        var req = TF.Required[v.required](sc);
        if (!req) return { kind: 'asRequired', conform: true, seen: 'Non requis dans ce scénario', ctl: v.ctl };
        var oka = TF.evalCond(v.cond, S);
        return { kind: 'asRequired', conform: oka, seen: 'Requis dans ce scénario : ' + (oka ? 'effectué' : 'NON effectué'), ctl: v.ctl };
      case 'declarative':
        return { kind: 'declarative', conform: null, seen: 'Vérification non simulée : à confirmer par le pilote', zone: v.zone };
    }
    return { kind: 'unknown', conform: null };
  };
  ChecklistRun.prototype.look = function (i) {
    var r = this.inspect(i), st = this.items[i];
    st.looked = true; st.seen = r.seen; if (r.conform === false) st.nonConformSeen = true;
    this.emit('change', i); return r;
  };
  ChecklistRun.prototype.respond = function (i, reveal) {
    var st = this.items[i]; st.responded = true; if (reveal) { st.revealed = true; st.aids++; }
    this.emit('change', i);
  };
  ChecklistRun.prototype.aid = function (i) { this.items[i].aids++; this.emit('change', i); };
  ChecklistRun.prototype.confirm = function (i) {
    var st = this.items[i], r = this.inspect(i);
    st.attempts++;
    if (r.kind !== 'declarative' && !st.looked) return { ok: false, reason: 'Regarde d\'abord la commande ou l\'indication concernée.' };
    if (r.kind === 'declarative' && !st.responded) return { ok: false, reason: 'Donne d\'abord la réponse prescrite.' };
    if (r.conform === false) { st.nonConformSeen = true; this.emit('change', i); return { ok: false, nonConform: true, reason: 'Non conforme : ' + r.seen + '. Corrige (action) puis vérifie à nouveau.' }; }
    st.confirmed = true; st.seen = r.seen;
    if (i === this.idx) this.idx = i + 1;
    this.emit('change', i);
    return { ok: true };
  };
  ChecklistRun.prototype.done = function () { return this.items.every(function (x) { return x.confirmed; }); };
  ChecklistRun.prototype.result = function () {
    var self = this;
    var items = this.def.items.map(function (it, i) {
      var st = self.items[i];
      return { label: it.label, resp: it.resp, confirmed: st.confirmed, aids: st.aids, revealed: st.revealed, nonConformSeen: st.nonConformSeen };
    });
    return {
      checklist: this.def.id, mode: this.mode, items: items,
      confirmed: items.filter(function (x) { return x.confirmed; }).length, total: items.length,
      noAid: items.filter(function (x) { return x.confirmed && !x.aids; }).length,
      nonConform: items.filter(function (x) { return x.nonConformSeen; }).length,
      calledStart: this.calledStart, calledComplete: this.calledComplete, duration: Date.now() - this.started
    };
  };
  TF.ChecklistRun = ChecklistRun;
})(this);

</script>

<script>/* js/pedagogy/trainer.js */
/* D. MOTEUR PÉDAGOGIQUE — planification des révisions, sessions, exercices ciblés.
 * Priorité : précision, complétude, respect des procédures. La vitesse n'est jamais un critère de maîtrise.
 */
(function (root) {
  'use strict';
  var TF = root.TF;

  var SESSIONS = [
    { id: 'flash', label: 'Mémorisation flash', minutes: 3, desc: 'Étapes isolées tirées de tes points faibles : retrouve et manipule la bonne commande, sans aide.' },
    { id: 'repeat', label: 'Répétition des flows', minutes: 10, desc: 'Flows complets de mémoire, en commençant par ceux qui sont dus ou ratés.' },
    { id: 'prep', label: 'Préparation de séance', minutes: 25, desc: 'Enchaînement des procédures de ton prochain vol : flow de mémoire, checklist, débriefing.' }
  ];

  /* Niveau de maîtrise d'une procédure pour un profil (0..1) */
  function mastery(p, procId) {
    var pr = p.procs[procId]; if (!pr) return 0;
    var proc = TF.ProcEngine.procById(procId); if (!proc) return 0;
    var n = 0, sum = 0;
    proc.steps.forEach(function (s) { var x = p.steps[procId + '/' + s.id]; n++; if (x) sum += (x.box - 1) / 4; });
    var stepM = n ? sum / n : 0;
    return Math.min(1, 0.6 * stepM + 0.4 * Math.min(1, pr.perfectMemory / 3));
  }

  /* Plan de révision : liste ordonnée {proc, mode, reason} */
  function plan(p, minutes, focusProcs) {
    var now = Date.now(), items = [];
    var procs = TF.DATA.procedures.map(function (x) { return x.id; });
    if (focusProcs && focusProcs.length) procs = procs.filter(function (id) { return focusProcs.indexOf(id) >= 0; });
    procs.forEach(function (id) {
      var pr = p.procs[id], m = mastery(p, id), due = 0, fails = 0;
      Object.keys(p.steps).forEach(function (k) {
        if (k.indexOf(id + '/') !== 0) return; var x = p.steps[k];
        if (x.due <= now && x.box < 5) due++; if (x.box === 1 && x.fails) fails++;
      });
      var score = (1 - m) * 10 + fails * 4 + due + (pr ? 0 : 2);
      var mode = !pr ? 'guided' : (m < 0.35 ? 'guided' : 'memory');
      var reason = !pr ? 'Jamais travaillée : découverte guidée' : fails ? fails + ' étape(s) à retravailler' : due ? due + ' étape(s) à réviser' : 'Entretien (maîtrise ' + Math.round(m * 100) + ' %)';
      items.push({ proc: id, mode: mode, reason: reason, score: score, mastery: m });
    });
    items.sort(function (a, b) { return b.score - a.score; });
    return items;
  }

  /* Étapes pour la session flash : étapes ratées / dues, sinon tirage */
  function flashSteps(p, count) {
    var now = Date.now(), list = [];
    Object.keys(p.steps).forEach(function (k) { var x = p.steps[k]; if (x.box < 5 && (x.fails || x.due <= now)) list.push({ key: k, w: (6 - x.box) + x.fails }); });
    list.sort(function (a, b) { return b.w - a.w; });
    var out = list.map(function (x) { var parts = x.key.split('/'); return { proc: parts[0], step: parts[1] }; });
    if (out.length < count) {
      TF.DATA.procedures.forEach(function (pr) {
        pr.steps.forEach(function (s) {
          if (s.kind === 'set' || s.kind === 'press' || s.kind === 'observe') out.push({ proc: pr.id, step: s.id });
        });
      });
    }
    var seen = {}, res = [];
    for (var i = 0; i < out.length && res.length < count; i++) {
      var k = out[i].proc + '/' + out[i].step; if (seen[k]) continue; seen[k] = 1;
      var st = TF.ProcEngine.stepById(TF.ProcEngine.procById(out[i].proc), out[i].step);
      if (st && (st.kind === 'set' || st.kind === 'press' || st.kind === 'observe' || st.kind === 'achieve')) res.push(out[i]);
    }
    return res;
  }

  /* Message de synthèse (ex. « Tu as réussi 12 actions sur 15 sans aide. ») */
  function summary(res) {
    var n = res.okNoAid, t = res.total, rw = t - n;
    var s = 'Tu as réussi ' + n + ' action' + (n > 1 ? 's' : '') + ' sur ' + t + ' sans aide.';
    if (rw > 0) s += ' ' + rw + ' étape' + (rw > 1 ? 's sont' : ' est') + ' à retravailler.';
    else if (res.leftChanged) s += ' Attention aux commandes manipulées hors procédure.';
    else s += ' Flow parfait.';
    return s;
  }

  TF.Trainer = { SESSIONS: SESSIONS, mastery: mastery, plan: plan, flashSteps: flashSteps, summary: summary };
})(this);

</script>
<script>/* js/profiles/profiles.js */
/* F. PROFILS — cinq pilotes, sauvegarde locale automatique, export / import.
 * Stockage : localStorage (clé « tiffanir.v1 »). Aucune connexion Internet requise.
 */
(function (root) {
  'use strict';
  var TF = root.TF;
  var KEY = 'tiffanir.v1';
  var NAMES = ['Nicolas', 'Julien', 'Jayson', 'Olivier', 'Cyril'];
  var DAY = 86400000;
  var INTERVALS = [0, 0, DAY, 2 * DAY, 4 * DAY, 7 * DAY]; // boîtes de Leitner 1..5
  var FLIGHTS = [{ id: 'sim', label: 'Simulateur' }, { id: 'v1', label: 'Vol 1' }, { id: 'v2', label: 'Vol 2' }, { id: 'v3', label: 'Vol 3' }, { id: 'v4', label: 'Vol 4' }, { id: 'v5', label: 'Vol 5' }, { id: 'v6', label: 'Vol 6' }];

  /* Semaine ISO (ex. « 2026-W46 ») : base du défi et du classement hebdomadaires */
  function weekId(t) {
    var d = new Date(t || Date.now()); d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1)), w = Math.ceil(((d - y0) / 86400000 + 1) / 7);
    return d.getUTCFullYear() + '-W' + (w < 10 ? '0' : '') + w;
  }
  /* Jour local (ex. « 2026-11-14 ») : base du défi et du classement quotidiens */
  function dayId(t) { var d = new Date(t || Date.now()); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function storage() { try { return root.localStorage || null; } catch (e) { return null; } }
  function blank() {
    var d = { app: 'tiffanir', version: 1, current: null, profiles: {} };
    NAMES.forEach(function (n) { d.profiles[n.toLowerCase()] = newProfile(n); });
    return d;
  }
  function newProfile(n) {
    var flights = {};
    FLIGHTS.forEach(function (f) { flights[f.id] = { objectives: '', procs: [], date: '', notes: '' }; });
    return { id: n.toLowerCase(), name: n, created: Date.now(), history: [], steps: {}, procs: {}, checklists: {}, flights: flights, nextFlight: 'sim', phases: {}, xp: 0, badges: [], days: [], bestStreak: 0,
      settings: { calloutLevel: 'guided', showLabels: false, sound: true, voice: true, voiceSteps: true } };
  }
  var data = null, memoryOnly = false;
  function load() {
    var st = storage(), raw = null;
    try { raw = st ? st.getItem(KEY) : null; } catch (e) { memoryOnly = true; }
    if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
    if (!data || data.app !== 'tiffanir') data = blank();
    NAMES.forEach(function (n) { var id = n.toLowerCase(); if (!data.profiles[id]) data.profiles[id] = newProfile(n); migrate(data.profiles[id]); });
  }
  function migrate(p) {
    var d = newProfile(p.name);
    ['phases', 'xp', 'badges', 'days', 'bestStreak'].forEach(function (k) { if (p[k] == null) p[k] = d[k]; });
    for (var k in d.settings) if (p.settings[k] == null) p.settings[k] = d.settings[k];
  }
  function save() {
    var st = storage();
    try { if (st) st.setItem(KEY, JSON.stringify(data)); } catch (e) { memoryOnly = true; }
    TF.bus.emit('profiles:saved');
  }
  load();

  var P = TF.Profiles = {
    NAMES: NAMES, FLIGHTS: FLIGHTS,
    list: function () { return NAMES.map(function (n) { return data.profiles[n.toLowerCase()]; }); },
    get: function (id) { return data.profiles[id]; },
    select: function (id) { data.current = id; save(); TF.bus.emit('profile:changed', P.current()); },
    current: function () { return data.current ? data.profiles[data.current] : null; },
    isPersistent: function () { return !memoryOnly && !!storage(); },
    save: save,
    /* Enregistre le résultat d'un flow et met à jour la répétition espacée */
    recordResult: function (res) {
      var p = P.current(); if (!p) return;
      var now = Date.now();
      p.history.push({ t: now, kind: 'flow', proc: res.proc, mode: res.mode, total: res.total, okNoAid: res.okNoAid, perfect: !!res.perfect, duration: res.duration || res.wallDuration || 0, toRework: res.toRework || [], errors: res.errors || 0 });
      if (p.history.length > 400) p.history = p.history.slice(-400);
      var pr = p.procs[res.proc] = p.procs[res.proc] || { attempts: 0, perfectMemory: 0, lastPerfect: null, best: 0, last: null, box: 1, due: 0 };
      pr.attempts++; pr.last = now;
      var ratio = res.total ? res.okNoAid / res.total : 0;
      pr.best = Math.max(pr.best, Math.round(ratio * 100));
      var memoryLike = res.mode === 'memory' || res.mode === 'exam';
      if (res.perfect && memoryLike) { pr.perfectMemory++; pr.lastPerfect = now; pr.box = Math.min(5, pr.box + 1); }
      else if (memoryLike) pr.box = 1;
      pr.due = now + INTERVALS[pr.box];
      (res.steps || []).forEach(function (s) {
        if (s.status === 'na') return;
        var k = res.proc + '/' + s.id, x = p.steps[k] = p.steps[k] || { seen: 0, ok: 0, fails: 0, box: 1, due: 0, last: null };
        x.seen++; x.last = now;
        if (s.status === 'ok') { x.ok++; if (memoryLike || res.mode === 'drill') x.box = Math.min(5, x.box + 1); }
        else { x.fails++; x.box = 1; }
        x.due = now + INTERVALS[x.box];
      });
      save();
    },
    recordChecklist: function (r) {
      var p = P.current(); if (!p) return;
      p.history.push({ t: Date.now(), kind: 'checklist', proc: r.checklist, mode: r.mode, total: r.total, okNoAid: r.noAid, perfect: r.noAid === r.total && r.calledStart && r.calledComplete, duration: r.duration });
      var c = p.checklists[r.checklist] = p.checklists[r.checklist] || { attempts: 0, autonomousOk: 0 };
      c.attempts++; if (r.mode === 'autonomous' && r.noAid === r.total) c.autonomousOk++;
      save();
    },
    setFlight: function (fid, patch) { var p = P.current(); if (!p) return; var f = p.flights[fid]; for (var k in patch) f[k] = patch[k]; save(); },
    setSetting: function (k, v) { var p = P.current(); if (!p) return; p.settings[k] = v; save(); },
    frequentErrors: function (p, n) {
      var arr = Object.keys(p.steps).map(function (k) { var x = p.steps[k]; return { key: k, fails: x.fails, seen: x.seen, box: x.box }; })
        .filter(function (x) { return x.fails > 0; }).sort(function (a, b) { return b.fails - a.fails || a.box - b.box; });
      return arr.slice(0, n || 8);
    },
    exportAll: function () { return JSON.stringify({ app: 'tiffanir', version: 1, exported: new Date().toISOString(), data: data }, null, 1); },
    importAll: function (str) {
      var o; try { o = JSON.parse(str); } catch (e) { return { ok: false, reason: 'Fichier illisible (JSON invalide).' }; }
      if (!o || o.app !== 'tiffanir' || !o.data || !o.data.profiles) return { ok: false, reason: 'Ce fichier n\'est pas une sauvegarde TIFFAN\'IR.' };
      var cur = data.current; data = o.data; if (!data.current) data.current = cur;
      NAMES.forEach(function (n) { var id = n.toLowerCase(); if (!data.profiles[id]) data.profiles[id] = newProfile(n); migrate(data.profiles[id]); });
      save(); TF.bus.emit('profile:changed', P.current());
      return { ok: true };
    },
    LEVELS: [[0, 'Élève pilote'], [200, 'Pilote CPL'], [600, 'Pilote IR'], [1200, 'Pilote IR/ME'], [2500, 'Commandant de bord'], [5000, 'Casseur de Flow']],
    level: function (p) { var L = P.LEVELS, cur = L[0], nxt = null; for (var i = 0; i < L.length; i++) { if (p.xp >= L[i][0]) { cur = L[i]; nxt = L[i + 1] || null; } } return { name: cur[1], min: cur[0], next: nxt ? nxt[0] : null, nextName: nxt ? nxt[1] : null }; },
    BADGES: {
      first: ['🎯', 'Premier flow', 'Terminer un premier élément'], perfect: ['💎', 'Sans faute', 'Un flow parfait de mémoire'], streak10: ['🔥', 'Série de 10', '10 actions de suite sans indice'],
      phase3: ['⭐', 'Trois étoiles', 'Une phase à 3 étoiles'], fullflight: ['✈️', 'Vol complet', 'Toutes les phases au moins à 1 étoile'], g1000: ['🖥', 'Maître du G1000', 'Atelier G1000 à 3 étoiles'],
      days3: ['📅', 'Régulier', '3 jours d\'entraînement']
    },
    award: function (id) { var p = P.current(); if (!p || p.badges.indexOf(id) >= 0) return false; p.badges.push(id); save(); return true; },
    weekId: weekId,
    dayId: dayId,
    feat: function (txt) { var p = P.current(); if (!p) return; p.lastFeat = { t: Date.now(), txt: txt }; save(); },
    addXp: function (n) { var p = P.current(); if (!p) return; p.xp = (p.xp || 0) + n; var wk = weekId(); if (p.week !== wk) { p.week = wk; p.weekXp = 0; } p.weekXp = (p.weekXp || 0) + n;
      var dy = dayId(); if (p.day !== dy) { p.day = dy; p.dayXp = 0; } p.dayXp = (p.dayXp || 0) + n; var d = new Date().toISOString().slice(0, 10); if (p.days.indexOf(d) < 0) p.days.push(d); if (p.days.length >= 3) P.award('days3'); save(); },
    /* Résultat d'une phase : pct = actions sans aide / total ; renvoie étoiles et badges gagnés */
    recordPhase: function (phaseId, level, pct, perfect) {
      var p = P.current(); if (!p) return {};
      var ph = p.phases[phaseId] = p.phases[phaseId] || { discover: false, practice: 0, memory: 0, stars: 0, runs: 0 };
      ph.runs++; ph.last = Date.now();
      if (level === 'discover') ph.discover = true;
      if (level === 'practice') ph.practice = Math.max(ph.practice, pct);
      if (level === 'memory') ph.memory = Math.max(ph.memory, perfect ? 100 : pct);
      var stars = 0;

    },
    resetProfile: function (id) { var n = data.profiles[id].name; data.profiles[id] = newProfile(n); save(); }
  };
})(this);

    if (!f.onGround) return f.alt < 1500 && f.vs > 200 ? 'Montée initiale' : f.vs > 200 ? 'Montée' : f.vs < -200 ? 'Descente' : 'En vol';
    if (f.ias > 30) return 'Décollage / course';
    if (f.label && /point d'arrêt/i.test(f.label)) return 'Point d\'arrêt';
    if (f.ias > 0.5) return 'Roulage';

    var show = (eng || !f.onGround || f.pos > 0) && !document.getElementById('home').offsetParent && !document.getElementById('ess').offsetParent;

  };
  /* Garde l'élément en cours au centre de sa liste : on voit toujours l'item d'avant et l'item d'après */
  /* Garde l'item courant au milieu : d'abord dans la liste (si elle défile), puis dans le panneau qui la contient
     (sur téléphone, c'est le panneau instructeur qui défile : l'item suit au lieu de rester bloqué en haut). */

/* Interface — traduction des gestes en manipulations de commandes (modèle B), observations et annonces. */

        (k.push ? '<button class="pop-pos" data-a="push">PUSH — ' + esc(k.push) + '</button>' : '') + '</div><div class="ref">' + esc(TF.refText(d.ref)) + '</div>';

  I.declareCallout = function () {

  I.openCallout = function () {

<script>/* js/ui/session.js */
/* D. MOTEUR PÉDAGOGIQUE (interface) — une SÉANCE = une phase du vol jouée à un niveau :
 *  1 · Découvrir  : l'instructeur fait, montre et dit tout (flow audio).
 *  2 · S'entraîner: tu fais tout ; instruction affichée, indices progressifs, annonces lues après toi.
 *  3 · De mémoire : rien n'est affiché ; débriefing précis à la fin de chaque élément.
 * Le cockpit garde ses états d'un élément à l'autre (continuité du vol).

(function (root) {
  'use strict';
  var TF = root.TF, K = TF.UI, esc = TF.util.esc, PE = TF.ProcEngine, V = TF.Voice;

  var ICON = { set: '✋', press: '👆', observe: '👁', confirm: '☑︎', achieve: '🎛', callout: '🎙', briefing: '🗣', constraint: '⏱', look: '🔍' };
  var LEVELS = { discover: 'Découvrir', practice: 'S\'entraîner', memory: 'De mémoire' };

  function S(app) {
    this.app = app; this.mode = 'idle'; this.level = null; this.phase = null; this.idx = 0; this.results = [];
    this.attempt = null; this.proc = null; this.expected = null; this.hintLevel = 0; this.feedback = null;
    this.lookArmed = false; this.streak = 0; this.bestStreak = 0; this.scriptsStarted = {}; this.free = this.idle;
  }
  var P = S.prototype;

  /* ---------- API utilisée par Interact / Checklist ---------- */
  P.locked = function () { return this.level === 'discover' && (this.mode === 'proc' || this.mode === 'cl'); };
  P.isTesting = function () { return this.level === 'memory'; };
  P.calloutLevel = function () { return this.level === 'discover' ? 'beginner' : this.level === 'practice' ? 'guided' : 'autonomous'; };
  P.confirmedItems = function () { return this.attempt ? this.attempt.events.filter(function (e) { return e.type === 'confirm'; }).map(function (e) { return e.item; }) : []; };
  P.expectedCallout = function () {
    if (this.mode === 'cl' && this.app.checklistUI.active()) return this.app.checklistUI.expectedCallout();
    var c = this.expected; return c && c.kind === 'callout' ? c.text : null;
  };
  P.intercept = function (kind, id, info) {
    if (TF.Ess && TF.Ess.intercept(kind, id)) return true;
    if (this.app.checklistUI.active() && this.app.checklistUI.intercept(kind, id, info)) return true;
    if (this.lookArmed && kind === 'ctl') {
      this.lookArmed = false; this.syncLookBtn();
      var d = this.app.ck.defs[id], v = this.app.ck.get(id);
      if (this.attempt) this.attempt.look(id);
      K.toast('🔍 ' + esc(d.short) + ' : <b>' + esc(typeof v === 'number' ? Math.round(v * (d.type === 'rotary' ? 100 : 1)) + ' %' : v) + '</b>', '', 1600);
      this.app.view.clearHighlight(); this.app.view.highlight(id, 'ok');
      var self = this; setTimeout(function () { self.app.view.clearHighlight(); }, 900);
      return true;
    }
    return false;
  };
  P.armLook = function () { this.lookArmed = !this.lookArmed; this.syncLookBtn(); if (this.lookArmed) K.toast('🔍 Touche la commande dont tu veux contrôler la position', '', 1800); };
  P.syncLookBtn = function () { var b = K.$('tbLook'); if (b) b.classList.toggle('on', this.lookArmed); };
  P.recordObserve = function (zone, ids) {
    if (this.attempt) this.attempt.observe(zone, ids); else this.app.ck.markObserved(ids);
    if (this.app.checklistUI.active()) this.app.checklistUI.onObserve(zone, ids);
  };
  P.recordConfirm = function (item) { if (this.attempt) this.attempt.confirm(item); if (this.app.checklistUI.active()) this.app.checklistUI.onConfirmItem(item); };
  /* Annonce déclarée par l'élève (un seul tap). En « S'entraîner », une annonce liée à un instant précis
   * (« Sixty » à 60 kt…) n'est pas enregistrée trop tôt : on explique quand la faire, sans bloquer la suite. */
  var WHEN_TXT = { rollStarted: 'dès que la course au décollage a commencé', speedAlive: 'dès que la vitesse s\'anime (PFD et secours)', speedAlivePfd: 'dès que la vitesse s\'anime sur le PFD (20 kt)', speedAliveStby: 'dès que l\'aiguille de l\'anémomètre de secours s\'anime', ias60: 'à 60 kt', atVr: 'à VR 76 kt',
    posClimb: 'vario positif et altitude qui augmente', turningRight: 'pendant le virage à droite', turningLeft: 'pendant le virage à gauche', atHoldingPoint: 'une fois arrêté au point d\'arrêt', hundredAbove: 'à 100 ft au-dessus des minima', atMinima: 'aux minima' };
  P.whenText = function (st) { return WHEN_TXT[st.when] || 'au moment prévu'; };
  P.windowOpen = function (st) { return !st || !st.when || TF.evalCond(st.when, this.app.ck.s); };
  /* ---------- Laisser le temps ----------
   * simRate : choix de l'élève (1 = normal, 0.5 = ralenti, 0 = pause).
   * En « S'entraîner », le scénario ATTEND l'élève : il s'arrête au moment d'une annonce tant qu'elle n'est pas faite,
   * et il ne laisse jamais passer le moment d'une annonce pendant que l'élève fait les étapes précédentes. */

    for (var k = i + 1; k < proc.steps.length; k++) {
      var st = proc.steps[k];

  /* De mémoire : même attente, mais limitée à 8 s par annonce (une annonce oubliée reste oubliée). */

    for (var k = i; k < proc.steps.length; k++) { var q = proc.steps[k]; if (q.when && (q.kind === 'callout' || q.kind === 'observe')) { target = q; break; } }

    return now - this._holdT[target.id] < 8000;
  };
  P.flightRate = function () {
    if (!this.phase) return 1;
    var base = this.simRate == null ? 1 : this.simRate;
    if (!base) return 0;
    var f = this.app.ck.s.flight; if (!f || (!f.script && f.onGround)) { this.holding = false; return base; }
    if (this.level === 'discover') { this.holding = false; if (this.paused || this.shouldHold()) return 0; return base * this.demoSpeed(); }
    var hold = this.level === 'practice' ? this.shouldHold() : this.level === 'memory' ? this.memoryHold() : false;

    return hold ? 0 : base;
  };
  P.cycleRate = function () {
    var r = this.simRate == null ? 1 : this.simRate;

    this.syncRate();
  };
  /* Schéma de roulage (LFBU) : parking → zone sûre (vérifs en virage) → point d'arrêt. Schéma, pas une carte. */
  P.syncTaxi = function () {
    var el = K.$('taxiStrip'); if (!el) return;
    var on = !!(this.phase && this.proc && this.proc.id === 'taxi' && this.mode === 'proc');
    el.classList.toggle('hidden', !on); if (!on) return;
    var f = this.app.ck.s.flight, p = Math.max(0, Math.min(1, f.pos || 0)), key = Math.round(p * 200) + '|' + (f.label || '') + '|' + Math.round(f.ias) + '|' + Math.round(f.hdg);
    if (el._k === key) return; el._k = key;
    el.innerHTML = '<div class="tx-h"><b>🛞 Roulage — Angoulême (LFBU)</b><span>' + esc(f.label || '') + ' · GS ' + Math.round(f.ias) + ' kt · cap ' + ('00' + Math.round(f.hdg || 360)).slice(-3) + '°</span></div>' +
      '<div class="tx-track"><i class="tx-done" style="width:' + (p * 100).toFixed(1) + '%"></i>' +
      '<span class="tx-m" style="left:0%">🅿️<small>Parking</small></span><span class="tx-m" style="left:32%">↻<small>Virages : vérif. instruments</small></span><span class="tx-m end" style="left:100%">🛑<small>Point d\'arrêt</small></span>' +
      '<span class="tx-ac" style="left:' + (p * 100).toFixed(1) + '%">✈︎</span></div><div class="tx-note">Schéma du roulage — pas une carte de l\'aérodrome</div>';
  };
  P.syncRate = function () {
    this.syncTaxi();
    var f = this.app.ck.s.flight, active = !!(this.phase && f && (f.script || !f.onGround));
    var b = K.$('tbRate'), chip = K.$('simHold');
    if (b) { b.classList.toggle('hidden', !active); var r = this.simRate == null ? 1 : this.simRate; b.textContent = r === 0 ? '▶ Reprendre' : r === 0.5 ? '🐢 ×0,5' : '⏱ ×1'; b.classList.toggle('on', r !== 1); }
    if (chip) { var show = active && (this.simRate === 0 || this.holding); chip.classList.toggle('hidden', !show); chip.textContent = this.simRate === 0 ? '⏸ Scénario en pause — touche « Reprendre »' : (this.level === 'memory' ? '⏳ Temps suspendu quelques secondes' : '⏳ Le scénario t\'attend : fais l\'étape en cours'); }
  };
  P.recordCallout = function (text, recognized) {
    if (this.app.checklistUI.active() && this.app.checklistUI.onCallout(text)) return { ok: true };

      K.sound.err(); this.render(); return { ok: false, msg: 'Trop tôt' };
    }
    if (this.level === 'practice' && exp && exp.kind === 'callout' && !this.windowOpen(exp)) {
      this.feedback = { k: 'err', m: '⏳ Trop tôt : « ' + esc(exp.text) + ' » se dit ' + esc(this.whenText(exp)) + '. Attends le moment, puis annonce.' };
      K.sound.err(); this.render(); return { ok: false, msg: 'Trop tôt' };

        bad.slice(0, 6).forEach(function (s) { h += '<div><b>' + esc(s.step.kind === 'callout' ? '« ' + s.step.text + ' »' : s.step.label + ' — ' + s.step.response) + '</b><span>' + esc(stLabel(s.status) + (s.notes.length ? ' · ' + s.notes[0] : '')) + '</span></div>'; });

<script>/* js/social/board.js */
/* Classement partagé « Les Casseurs Flowteurs » + défi du jour.
 * Trois modes, choisis automatiquement :
 *  1. Google Apps Script (TF.CONFIG.boardUrl renseigné, voir js/config.js et apps-script/Code.gs) — version GitHub Pages ;
 *  2. base `db` de l'artifact claude.ai (si la page tourne sur claude.ai) ;
 *  3. hors ligne : section désactivée, l'appli fonctionne normalement.
 * Données publiées : prénom de pilote, niveau, XP, étoiles, badges, dernier exploit. Rien d'autre.
 */
(function (root) {
  'use strict';
  var TF = root.TF, K = TF.UI, esc = TF.util.esc;
  var B = TF.Board = { state: 'off', entries: [], canWrite: null, tab: 'day', mode: null };
  var lastSent = null, timer = null, writing = false, again = false, prevRank = null, pollT = null;
  var db = null, uid = null, mineDoc = null, firstSync = false;

  function phasesForChallenge() { return TF.DATA.phases.filter(function (x) { return !x.hidden; }); }
  /* Défi du jour : le même pour tout le monde, il change à minuit (heure de l'appareil). */
  B.challenge = function () {
    var day = TF.Profiles.dayId(), p = day.split('-'), n = Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5), phs = phasesForChallenge(), ph = phs[n % phs.length];
    return { day: day, phase: ph.id, title: ph.title, icon: ph.icon };
  };
  B.maxStars = function () { return phasesForChallenge().length * 3; };
  function streak(p) {
    var set = {}, n = 0, d = new Date(); (p.days || []).forEach(function (x) { set[x] = 1; });
    if (!set[d.toISOString().slice(0, 10)]) d = new Date(d.getTime() - 864e5);
    while (set[d.toISOString().slice(0, 10)]) { n++; d = new Date(d.getTime() - 864e5); }
    return n;
  }
  B.streak = streak;
  /* Ligne publiée pour un pilote local */
  function pilotRow(p) {
    var stars = {}, tot = 0, ch = {}, keys = Object.keys(p.challenges || {}).sort().slice(-40);
    phasesForChallenge().forEach(function (ph) { var s = (p.phases[ph.id] || {}).stars || 0; stars[ph.id] = s; tot += s; });
    keys.forEach(function (k) { ch[k] = p.challenges[k]; });
    return { name: p.name, xp: p.xp || 0, level: TF.Profiles.level(p).name, stars: stars, totalStars: tot, day: p.day || '', dayXp: p.dayXp || 0,
      challenges: ch, streak: streak(p), badges: (p.badges || []).length, feat: p.lastFeat || null };
  }
  function localPilots() { var o = {}; TF.Profiles.list().forEach(function (p) { if ((p.xp || 0) > 0) o[p.id] = pilotRow(p); }); return o; }

  /* ---------- Démarrage ---------- */
  B.init = function () {
    var cfg = TF.CONFIG || {};
    TF.bus.on('profiles:saved', function () { B.schedule(2500); });
    if (cfg.boardUrl) return AS.init(cfg);
    var c = root.claude;
    if (c && typeof c.use === 'function') return DBX.init(c);
    B.state = 'offline';
  };
  B.schedule = function (ms) {
    if (!B.mode || B.canWrite === false) return;
    clearTimeout(timer); timer = setTimeout(B.sync, ms == null ? 2500 : ms);
  };
  B.sync = function () {
    if (!B.mode || B.canWrite === false) return;
    if (writing) { again = true; return; }
    var pilots = localPilots(); if (!Object.keys(pilots).length) return;
    var json = JSON.stringify(pilots); if (json === lastSent) return;
    writing = true;
    (B.mode === 'as' ? AS.push(pilots) : DBX.push(pilots)).then(function () {
      lastSent = json; writing = false; if (again) { again = false; B.schedule(800); }
    }, function (e) {
      writing = false;
      if (e && (e.code === 'invalid_argument' || e.code === 'code')) { B.canWrite = false; B.render(); }
      else if (e && e.code === 'quota_exceeded') { B.state = 'full'; B.render(); }
    });
  };
  function received(entries) { B.entries = entries; B.state = 'live'; B.render(); B.notifyOvertake(); }

  /* ---------- Mode 1 : Google Apps Script ---------- */
  var AS = {
    url: '', code: '',
    init: function (cfg) {
      B.mode = 'as'; B.state = 'loading';
      var q = /[?&]equipe=([^&#]+)/.exec(root.location.search || '');
      if (q) { try { localStorage.setItem('tiffanir.team', decodeURIComponent(q[1])); } catch (e) { } }
      var stored = null; try { stored = localStorage.getItem('tiffanir.team'); } catch (e) { }
      AS.url = cfg.boardUrl; AS.code = stored || cfg.teamCode || '';
      AS.pull(true);
      pollT = setInterval(function () { if (!root.document.hidden) AS.pull(); }, (cfg.refreshSeconds || 30) * 1000);
      root.document.addEventListener('visibilitychange', function () { if (!root.document.hidden) AS.pull(); });
    },
    req: function (method, body) {
      var url = AS.url + (AS.url.indexOf('?') < 0 ? '?' : '&') + 'code=' + encodeURIComponent(AS.code) + '&t=' + Date.now();
      var opt = method === 'POST' ? { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } } : { method: 'GET' };
      return new Promise(function (res, rej) {
        var done = false, to = setTimeout(function () { if (!done) { done = true; rej({ code: 'unavailable' }); } }, 15000);
        root.fetch(url, opt).then(function (r) { return r.json(); }).then(function (j) {
          if (done) return; done = true; clearTimeout(to);
          if (!j || !j.ok) rej({ code: (j && j.error) || 'unavailable' }); else res(j);
        }, function () { if (!done) { done = true; clearTimeout(to); rej({ code: 'unavailable' }); } });
      });
    },
    toEntries: function (rows) {
      var me = TF.Profiles.current();
      return (rows || []).map(function (r) { return { key: r.pid, me: !!(me && me.id === r.pid), data: r.data || {} }; });
    },
    pull: function (first) {
      AS.req('GET').then(function (j) { received(AS.toEntries(j.rows)); if (first) B.schedule(0); }, function (e) {
        if (e && e.code === 'code') { B.state = 'badcode'; B.canWrite = false; } else if (B.state !== 'live') B.state = 'slow';
        B.render();

    },
    push: function (pilots) { return AS.req('POST', { code: AS.code, pilots: pilots }).then(function (j) { received(AS.toEntries(j.rows)); }); }
  };

  /* ---------- Mode 2 : base db de l'artifact claude.ai ---------- */
  var DBX = {
    init: function (c) {
      B.state = 'loading';
      Promise.all([c.use('db'), c.use('user')]).then(function (r) {
        db = r[0]; var user = r[1];
        if (!db) { B.state = 'signedout'; B.render(); return; }
        B.mode = 'db';
        var slow = setTimeout(function () { if (B.state === 'loading') { B.state = 'slow'; B.render(); } }, 10000);
        if (user && typeof user.can === 'function') {
          try { Promise.resolve(user.can('data.write')).then(function (v) { if (v === false) { B.canWrite = false; B.render(); } }); } catch (e) { }
        }
        Promise.resolve(user && typeof user.id === 'function' ? user.id() : null).then(function (id) {
          uid = id || null;
          db.collection('board').onSnapshot(function (snap) {
            clearTimeout(slow);
            var me = TF.Profiles.current(), entries = [];
            mineDoc = null;
            snap.docs.forEach(function (d) {
              var data = d.data() || {}, ps = data.pilots || {};

            });

        });
      }, function () { B.state = 'offline'; B.render(); });
    },
    push: function (pilots) {

    }
  };

  /* ---------- Classement ---------- */
  B.rows = function () {
    var day = TF.Profiles.dayId(), me = TF.Profiles.current(), rows = [];
    function row(key, isMe, x) {
      var ch = x.challenges || {}, n = 0; for (var k in ch) if (ch[k]) n++;
      return { key: key, me: isMe, name: String(x.name || key).slice(0, 24), xp: +x.xp || 0, level: String(x.level || ''), totalStars: +x.totalStars || 0,
        stars: x.stars || {}, dayXp: x.day === day ? (+x.dayXp || 0) : 0, chalToday: +ch[day] || 0, trophies: n, streak: +x.streak || 0, badges: +x.badges || 0, feat: x.feat || null };
    }
    B.entries.forEach(function (e) { if (e.data && typeof e.data === 'object') rows.push(row(e.key, e.me, e.data)); });
    // ma ligne locale est plus fraîche que la dernière synchronisation
    if (me && (me.xp || 0) > 0 && B.mode && B.canWrite !== false) {
      var mine = row(me.id, true, pilotRow(me)), idx = -1;
      rows.forEach(function (r, i) { if (r.me) idx = i; });
      if (idx >= 0) { mine.key = rows[idx].key; rows[idx] = mine; } else rows.push(mine);
    }
    var f = B.tab === 'day' ? function (a, b) { return b.dayXp - a.dayXp || b.totalStars - a.totalStars; }
      : function (a, b) { return b.totalStars - a.totalStars || b.xp - a.xp; };
    return rows.sort(f);
  };
  B.notifyOvertake = function () {
    var rows = B.rows().slice().sort(function (a, b) { return b.dayXp - a.dayXp; }), i = -1;
    rows.forEach(function (r, k) { if (r.me) i = k; });
    if (i < 0) return;
    if (prevRank != null && i > prevRank && rows[i - 1]) K.toast('🔔 ' + esc(rows[i - 1].name) + ' vient de te passer devant aujourd\'hui !', '', 3200);
    prevRank = i;
  };
  function ago(t) {
    var m = Math.round((Date.now() - t) / 60000);
    return m < 2 ? 'à l\'instant' : m < 60 ? 'il y a ' + m + ' min' : m < 1440 ? 'il y a ' + Math.round(m / 60) + ' h' : 'il y a ' + Math.round(m / 1440) + ' j';
  }

  /* ---------- Rendu (accueil « Mon vol ») ---------- */
  B.html = function () {
    var rows = B.mode ? B.rows() : [];
    var h = '<div class="social">';
    h += '<div class="lb"><div class="lb-head"><b>👥 Le classement</b><span class="seg"><button data-act="tab" data-v="day" class="' + (B.tab === 'day' ? 'on' : '') + '">Aujourd\'hui</button><button data-act="tab" data-v="all" class="' + (B.tab === 'all' ? 'on' : '') + '">Général</button></span></div>';
    if (rows.length) {
      h += '<div class="lb-rows">';
      rows.forEach(function (r, i) {
        var val = B.tab === 'day' ? r.dayXp + ' XP' : r.xp + ' XP';
        var mini = phasesForChallenge().map(function (ph) { var s = +r.stars[ph.id] || 0; return '<i class="s' + s + '" title="' + esc(ph.title) + '"></i>'; }).join('');
        h += '<div class="lb-row' + (r.me ? ' me' : '') + '"><span class="lb-rk">' + (['🥇', '🥈', '🥉'][i] || (i + 1)) + '</span><span class="lb-n"><b>' + esc(r.name) + (r.me ? ' <em>toi</em>' : '') + '</b><small>' + esc(r.level) + (r.streak ? ' · 🔥 ' + r.streak + ' j' : '') + '</small>' +
          (r.feat && r.feat.txt ? '<small class="lb-f">' + esc(String(r.feat.txt).slice(0, 60)) + (r.feat.t ? ' · ' + ago(+r.feat.t) : '') + '</small>' : '') + '</span>' +
          '<span class="lb-s"><span class="lb-mini">' + mini + '</span><small>⭐ ' + r.totalStars + '/' + B.maxStars() + '</small></span><span class="lb-x">' + val + '</span></div>';
      });
      h += '</div>';
    }
    var note = {
      offline: 'Classement partagé non configuré : ta progression reste sur cet appareil (voir PUBLIER.md pour le brancher sur Google Sheets).',
      signedout: 'Connecte-toi à claude.ai pour voir le classement de l\'équipe et y apparaître.',
      loading: 'Chargement du classement…', slow: 'Classement injoignable pour l\'instant : ta progression est gardée et sera envoyée plus tard.',

  };

    var el = root.document.getElementById('hmBoard'); if (!el) return;

<script>/* js/ui/home.js */
/* Interface — accueil « Mon vol » : les phases du vol dans l'ordre, 3 niveaux, étoiles, XP, badges, bilans. */
(function (root) {
  'use strict';
  var TF = root.TF, K = TF.UI, esc = TF.util.esc, PE = TF.ProcEngine;
  var H = TF.Home = {};
  var LV = [
    { id: 'discover', n: '1', title: 'Découvrir', desc: 'L\'instructeur fait, montre et dit chaque action, annonce, check-list et briefing. Tu regardes et tu écoutes.', ico: '👀' },
    { id: 'practice', n: '2', title: 'S\'entraîner', desc: 'Tu fais tout toi-même. L\'action attendue est affichée, indices si besoin, annonces lues après toi.', ico: '✋' },
    { id: 'memory', n: '3', title: 'De mémoire', desc: 'Comme dans l\'avion : rien n\'est affiché. Débriefing précis à la fin de chaque élément.', ico: '🧠' }
  ];

  function stars(n) { return '<span class="stars">' + [0, 1, 2].map(function (i) { return '<i class="' + (i < n ? 'on' : '') + '">★</i>'; }).join('') + '</span>'; }
  function itemName(it) { return it.proc ? PE.procById(it.proc).title : 'C/L ' + TF.DATA.checklists.filter(function (c) { return c.id === it.cl; })[0].title; }

  /* Recommandation : une seule mission claire, dans l'ordre du vol et des niveaux (Découvrir → S'entraîner → De mémoire),
   * puis révision espacée de la phase la moins récemment travaillée. */
  var LVNAME = { discover: '👀 Découvrir', practice: '✋ S\'entraîner', memory: '🧠 De mémoire' };
  H.recommend = function (p) {
    var phs = TF.DATA.phases.filter(function (x) { return !x.lab; });
    for (var i = 0; i < phs.length; i++) {
      var ph = p.phases[phs[i].id];
      if (!ph || ph.stars < 3) {
        var lv = !ph || (!ph.discover && ph.practice < 60) ? 'discover' : (ph.practice < 90 && ph.memory < 75 ? 'practice' : 'memory');
        var why = lv === 'discover' ? 'Nouvelle phase : regarde et écoute l\'instructeur.' : lv === 'practice' ? 'Fais-le toi-même, avec la fiche OM-B à côté.' : (ph && ph.memory ? 'Meilleur score de mémoire : ' + ph.memory + ' %. Vise le sans-faute ⭐⭐⭐.' : 'Passe au niveau de l\'avion : rien n\'est affiché.');
        return { phase: phs[i], level: lv, why: why };
      }
    }
    var old = phs.slice().sort(function (a, b) { return (p.phases[a.id].last || 0) - (p.phases[b.id].last || 0); })[0];
    var d = Math.floor((Date.now() - (p.phases[old.id].last || 0)) / 864e5);
    return { phase: old, level: 'memory', why: 'Révision : ' + (d ? 'pas rejouée depuis ' + d + ' jour' + (d > 1 ? 's' : '') : 'garde le flow à jour') + '.', review: true };
  };
  function streak(p) {
    var set = {}, n = 0, d = new Date(); (p.days || []).forEach(function (x) { set[x] = 1; });
    if (!set[d.toISOString().slice(0, 10)]) d = new Date(d.getTime() - 864e5);
    while (set[d.toISOString().slice(0, 10)]) { n++; d = new Date(d.getTime() - 864e5); }
    return n;
  }
  function ladder(ph) {
    ph = ph || {};
    function c(done, part) { return done ? 'on' : (part ? 'half' : ''); }
    return '<span class="ladder"><i class="' + c(ph.discover) + '" title="Découvrir">👀</i><i class="' + c(ph.practice >= 90, ph.practice > 0) + '" title="S\'entraîner">✋</i><i class="' + c(ph.memory >= 100, ph.memory > 0) + '" title="De mémoire">🧠</i></span>';
  }
  H.show = function () {
    if (TF.Ess) TF.Ess.close();
    var p = TF.Profiles.current(); if (!p) return;
    var el = K.$('home'), L = TF.Profiles.level(p);
    var pct = L.next ? Math.round((p.xp - L.min) / (L.next - L.min) * 100) : 100;
    var h = '<div class="hm-in">';
    h += '<div class="hm-top"><div><div class="hm-hello">📚 Procédures complètes</div><div class="hm-sub">La référence exhaustive : chaque item OM-B, les check-lists, les annonces PDP. À consulter quand tu veux tout reprendre en détail.</div></div>';

    h += '<button class="mission" data-act="mission"><span class="ms-ico">' + rec.phase.icon + '</span><span class="ms-txt"><small>' + (rec.review ? '🔁 Révision du jour' : '▶ Ta prochaine mission') + '</small><b>' + esc(rec.phase.title) + ' · ' + LVNAME[rec.level] + '</b><em>' + esc(rec.why) + '</em></span><span class="ms-go">GO</span></button>';

    h += '<div id="hmBoard">' + TF.Board.html() + '</div>';
    h += '<div class="hm-track">';
    TF.DATA.phases.forEach(function (ph, i) {
      if (ph.lab) return;
      var st = (p.phases[ph.id] || {}).stars || 0;
      h += '<button class="ph-card' + (rec.phase.id === ph.id ? ' rec' : '') + '" data-act="phase" data-id="' + ph.id + '"><div class="pc-num">' + (i + 1) + '</div><div class="pc-ico">' + ph.icon + '</div><div class="pc-title">' + esc(ph.title) + '</div><div class="pc-sub">' + esc(ph.sub) + '</div><div class="pc-foot">' + stars(st) + ladder(p.phases[ph.id]) + '</div>' + (rec.phase.id === ph.id ? '<span class="pc-rec">▶ À faire</span>' : '') + '</button>';
      h += '<div class="ph-arrow">›</div>';
    });
    h = h.replace(/<div class="ph-arrow">›<\/div>$/, '');
    h += '</div><div class="hm-row">';
    var lab = TF.DATA.phases.filter(function (x) { return x.lab; })[0], ls = (p.phases.g1000 || {}).stars || 0;
    h += '<button class="wide-card lab" data-act="phase" data-id="g1000"><span class="wc-ico">🖥</span><span><b>Atelier G1000</b><small>' + esc(lab.sub) + ' — Garmin Pilot\'s Guide</small></span>' + stars(ls) + '</button>';
    h += '<button class="wide-card ess" data-act="ess"><span class="wc-ico">✈︎</span><span><b>Mon vol — l\'essentiel</b><small>Le flow et les procédures essentielles · l\'avion en chiffres · le tour avion</small></span></button>';
    h += '<button class="wide-card full" data-act="full"><span class="wc-ico">✈︎</span><span><b>Vol complet</b><small>Les 6 phases enchaînées, de la mise en route au parking</small></span></button>';
    h += '</div>';
    h += '<div class="hm-badges">' + Object.keys(TF.Profiles.BADGES).map(function (k) { var b = TF.Profiles.BADGES[k], has = p.badges.indexOf(k) >= 0; return '<span class="badge-i' + (has ? ' on' : '') + '" title="' + esc(b[1] + ' — ' + b[2]) + '">' + b[0] + '<small>' + esc(b[1]) + '</small></span>'; }).join('') + '</div>';
    h += '<div class="hm-foot"><button data-act="profile">📈 Ma progression</button><button data-act="next">📅 Prêt pour mon prochain vol</button><button data-act="docs">§ Sources & points à confirmer</button><button data-act="voices">🗣 Voix</button><button data-act="scenario">⚙︎ Scénario</button><button data-act="free">🛠 Cockpit libre</button><span class="hm-ver">version ' + TF.VERSION + '</span></div>';
    h += '</div>';

    K.bindActs(el, {
      phase: function (b) { H.pickLevel(b.getAttribute('data-id')); },
      mission: function () { TF.app.modes.startPhase(rec.phase.id, rec.level); },

      ess: function () { TF.Ess.show(); },
      profile: function () { TF.Screens.profile(); }, next: function () { TF.Screens.nextFlight(); }, docs: function () { TF.Screens.docs(); },
      scenario: function () { TF.Screens.scenario(); },
      voices: function () { TF.Screens.voices(); },
      free: function () { H.hide(); TF.app.modes.idle(); }
    });
  };
  H.hide = function () { K.$('home').classList.add('hidden'); };
  H.visible = function () { return !K.$('home').classList.contains('hidden'); };

  /* Choix du niveau : 3 boutons, rien d'autre */
  H.pickLevel = function (phId) {
    var full = phId === 'full';
    var ph = full ? { id: 'full', icon: '✈︎', title: 'Vol complet', items: [] } : TF.DATA.phases.filter(function (x) { return x.id === phId; })[0];
    if (full) TF.DATA.phases.forEach(function (x) { if (!x.lab) ph.items = ph.items.concat(x.items); });
    if (full && !TF.DATA.phases.filter(function (x) { return x.id === 'full'; })[0]) TF.DATA.phases.push({ id: 'full', icon: '✈︎', title: 'Vol complet', sub: '', items: ph.items, lab: true, hidden: true });
    var h = K.head(ph.icon + ' ' + esc(ph.title));
    h += '<div class="seq">' + ph.items.map(function (it, i) { return '<span>' + (i + 1) + '. ' + esc(itemName(it)) + '</span>'; }).join('<i>›</i>') + '</div>';
    h += '<div class="lv-grid">';
    LV.forEach(function (l) { h += '<button class="lv-card lv-' + l.id + '" data-act="go" data-lv="' + l.id + '"><div class="lv-n">' + l.ico + '</div><div class="lv-t">' + l.n + ' · ' + l.title + '</div><div class="lv-d">' + l.desc + '</div></button>'; });
    h += '</div>';
    if (!TF.Voice.available()) h += '<div class="caution">Synthèse vocale indisponible sur ce navigateur : les annonces seront affichées sans être lues.</div>';
    K.sheet(h, function (s) { K.bindActs(s, { go: function (b) { K.closeSheet(); TF.app.modes.startPhase(full ? 'full' : phId, b.getAttribute('data-lv')); } }); }, { width: '860px' });
  };

  /* Bilan de phase */
  H.results = function (phase, level, results, pct, rec, dur) {
    var p = TF.Profiles.current(), xp = 0; results.forEach(function (r) { xp += r.xp || 0; });
    var h = '<div class="res"><div class="res-ico">' + phase.icon + '</div><h2>' + esc(phase.title) + '</h2><div class="res-lvl">' + { discover: 'Découvrir', practice: 'S\'entraîner', memory: 'De mémoire' }[level] + ' · ' + TF.util.fmtTime(dur) + '</div>';
    h += '<div class="res-stars">' + [0, 1, 2].map(function (i) { return '<span class="' + (i < (rec.stars || 0) ? 'on' : '') + '" style="animation-delay:' + (i * 0.25) + 's">★</span>'; }).join('') + '</div>';
    if (level !== 'discover') h += '<div class="res-pct">' + pct + ' % d\'actions sans aide</div>';
    h += '<div class="res-xp">+' + xp + ' XP</div>';
    (rec.badges || []).forEach(function (b) { var B = TF.Profiles.BADGES[b]; h += '<div class="res-badge">' + B[0] + ' Nouveau badge : <b>' + esc(B[1]) + '</b></div>'; });
    h += '<table class="t" style="margin-top:12px">';
    results.forEach(function (r) {
      var tot = r.res.total, ok = r.kind === 'proc' ? r.res.okNoAid : r.res.noAid;
      h += '<tr><td>' + esc(r.kind === 'proc' ? r.proc.title : 'C/L ' + r.def.title) + '</td><td class="st ' + (ok === tot ? 's-ok' : 's-om') + '">' + ok + '/' + tot + '</td></tr>';
    });
    h += '</table><div class="res-acts">';
    var nextLv = level === 'discover' ? 'practice' : level === 'practice' ? 'memory' : 'memory';
    h += '<button class="btn primary big" data-act="again" data-lv="' + nextLv + '">' + (level === 'memory' ? '↺ Rejouer de mémoire' : '▶ Niveau suivant : ' + (nextLv === 'practice' ? 'S\'entraîner' : 'De mémoire')) + '</button>';
    var idx = TF.DATA.phases.indexOf(phase), nxt = TF.DATA.phases[idx + 1];
    if (nxt && !nxt.lab && !phase.lab) h += '<button class="btn big" data-act="nextph" data-id="' + nxt.id + '">Phase suivante : ' + esc(nxt.title) + '</button>';
    h += '<button class="btn" data-act="audio">🔊 Écouter le flow correct</button><button class="btn" data-act="home">Retour au vol</button></div></div>';
    K.sheet(h, function (s) {
      K.bindActs(s, {
        again: function (b) { K.closeSheet(); TF.app.modes.startPhase(phase.id, b.getAttribute('data-lv')); },
        nextph: function (b) { K.closeSheet(); H.pickLevel(b.getAttribute('data-id')); },
        audio: function () { TF.app.modes.playAudioFlow(phase); },
        home: function () { TF.Voice.stop(); K.closeSheet(); TF.app.modes.idle(); H.show(); }
      });
    }, { width: '620px' });
  };

  /* Panneau instructeur au repos */
  H.panelIdle = function () {
    return '<div class="idle-panel"><img src="assets/logo-192.png" alt=""><h3>Cockpit libre</h3><p>Manipule librement les commandes, touche les écrans pour lire les indications, tourne les boutons du G1000.</p>' +
      '<button class="btn primary big block" data-act="home">✈︎ Mon vol</button><button class="btn block" data-act="reset">Réinitialiser le cockpit</button>' +
      '<div class="sc-note" style="margin-top:12px">Astuce : pince ou molette pour zoomer · ⌂ vue générale · 🔍 contrôle une position sans la modifier.</div></div>';
  };
  H.panelActs = function () {
    return { home: function () { TF.Ess.show(); }, reset: function () { TF.app.ck.reset(TF.app.scenario()); TF.app.view.renderAll(); K.toast('Cockpit réinitialisé (fin de Cabin preparation, OM-B p.55)', 'ok'); } };
  };

  /* Confettis (célébration d'un sans-faute) */
  H.confetti = function () {
    var c = document.createElement('canvas'), W = root.innerWidth, Hh = root.innerHeight;
    c.width = W; c.height = Hh; c.className = 'confetti'; document.body.appendChild(c);
    var x = c.getContext('2d'), parts = [], cols = ['#3fe0e8', '#f2c21b', '#34d17a', '#ff5a5f', '#ffffff', '#3c8cff'];
    for (var i = 0; i < 160; i++) parts.push({ x: W / 2 + (Math.random() - 0.5) * 200, y: Hh / 3, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 3, c: cols[i % cols.length], a: Math.random() * 6 });
    var t0 = Date.now();
    (function f() {
      x.clearRect(0, 0, W, Hh);
      parts.forEach(function (p) { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.a += 0.2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });
      if (Date.now() - t0 < 2600) requestAnimationFrame(f); else document.body.removeChild(c);
    })();
    K.sound.ok(); setTimeout(K.sound.ok, 180);
  };
})(this);
