<script>/* js/ui/essentiel.js */
/* Interface — « L'essentiel » : fiche avion (chiffres clés), flow (time line) balayé dans le cockpit, tour avion.
 * Sources : notes manuscrites de cours (non approuvées, signalées comme telles) et OM-B pour le tour avion.
 */
(function (root) {
  'use strict';
  var TF = root.TF, K = TF.UI, esc = TF.util.esc, V = TF.Voice;
  var E = TF.Ess = { tab: 'flow', hide: false };
  var S = null, gen = 0;   // balayage en cours dans le cockpit
  function app() { return TF.app; }
  function ses() { return TF.app.modes; }

  /* ------------------------------------------------------------ Page ------------------------------------------------------------ */
  E.show = function (tab) {
    if (tab) E.tab = tab;
    TF.Home.hide();
    var el = K.$('ess'), h = '<div class="hm-in">';
    var pr = TF.Profiles.current();
    h += '<div class="ess-top"><div><div class="hm-hello">' + (pr ? 'Bonjour ' + esc(pr.name) + ' 👋 · ' : '') + 'Mon vol</div><div class="hm-sub">L\'essentiel : le flow et les procédures essentielles, l\'avion en chiffres, le tour avion. Le détail exhaustif est dans 📚 Procédures complètes.</div></div>' +
      '<button class="btn" data-act="home">📚 Procédures complètes</button></div>';
    h += '<div class="ess-tabs">' + [['flow', '⏱ Le flow'], ['avion', '✈️ L\'avion'], ['tour', '🚶 Tour avion'], ['brief', '🗣 Briefings'], ['test', '📝 Class test']].map(function (t) {
      return '<button data-act="tab" data-v="' + t[0] + '" class="' + (E.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>';
    h += E.tab === 'avion' ? ficheHtml() : E.tab === 'tour' ? walkHtml() : E.tab === 'test' ? testHtml() : E.tab === 'brief' ? briefHtml() : flowHtml();
    h += '<div class="hm-foot"><button data-act="voices">🗣 Voix</button><button data-act="free">🛠 Cockpit libre</button><span class="hm-ver">version ' + TF.VERSION + '</span></div>';
    h += '</div>';
    var keep = E._shown === E.tab && E.visible() ? el.scrollTop : 0; E._shown = E.tab;
    el.innerHTML = K.plain(h); el.classList.remove('hidden'); el.scrollTop = keep;
    K.bindActs(el, {
      home: function () { E.close(); TF.Home.show(); },
      tab: function (b) { E.show(b.getAttribute('data-v')); },
      voices: function () { TF.Screens.voices(); },
      // briefings
      bfield: function () { }, bplay: function () { briefPlay(); }, bstop: function () { V.stop(); },
      blevel: function (b) { E.bLevel = +b.getAttribute('data-v'); E.show('brief'); },
      breveal: function (b) { b.classList.add('shown'); },
      // class test
      ctstart: function (b) { var only = b.getAttribute('data-v'); var CT = TF.DATA.classTest.questions;
        E.ct = { list: only === 'wrong' && E.ct ? E.ct.wrong.slice() : CT.map(function (q) { return q.n; }), i: 0, ok: 0, wrong: [], picked: null }; E.show('test'); },
      ctpick: function (b) { if (!E.ct || E.ct.picked) return; var q = ctQ(E.ct.list[E.ct.i]), v = b.getAttribute('data-v'); E.ct.picked = v;
        if (v === q.ans) { E.ct.ok++; K.sound.ok(); TF.Profiles.addXp(1); } else { E.ct.wrong.push(q.n); K.sound.err(); } E.show('test'); },
      ctnext: function () { E.ct.i++; E.ct.picked = null; E.show('test'); var el = K.$('ess'); el.scrollTop = 0; },
      ctquit: function () { E.ct = null; E.show('test'); },
      ctlist: function () { E.ctList = !E.ctList; E.show('test'); },
      free: function () { E.close(); ses().idle(); },
      // flow
      sweep: function (b) { E.sweep(b.getAttribute('data-id'), 'demo'); },
      tryit: function (b) { E.sweep(b.getAttribute('data-id'), 'try'); },
      chipgo: function (b) { E.sweep(b.getAttribute('data-id'), 'try', +b.getAttribute('data-i')); },
      walktab: function () { E.show('tour'); },
      // fiche
      rev: function () { E.hide = !E.hide; E.show('avion'); },
      reveal: function (b) { b.classList.remove('hid'); },
      info: function (b) { var d = b.parentNode.parentNode.querySelector('.ec-def'); if (d) { d.classList.toggle('hidden'); b.classList.toggle('on'); } },
      quiz: function () { quiz(); },
      // tour avion
      st: function (b) { E.station = +b.getAttribute('data-n'); E.show('tour'); var d = K.$('wkDetail'); if (d && d.scrollIntoView) d.scrollIntoView(); },
      keyonly: function () { E.keyOnly = !E.keyOnly; E.show('tour'); },
      walkplay: function () { walkPlay(); },
      walkstop: function () { E.walkGen = (E.walkGen || 0) + 1; V.stop(); E.show('tour'); }
    });
  };
  E.close = function () { K.$('ess').classList.add('hidden'); E.walkGen = (E.walkGen || 0) + 1; E._shown = null; };
  E.visible = function () { return !K.$('ess').classList.contains('hidden'); };

  function srcBanner() {
    return '<div class="ess-src">📝 Notes de cours manuscrites (non approuvées) — en cas d\'écart, l\'OM-B et l\'AFM prévalent. ' +
      'Les mentions marquées <span class="doubt">?</span> sont des lectures du manuscrit à confirmer.</div>';
  }

  /* ---------------------------------------------------------- Fiche avion ---------------------------------------------------------- */
  function ficheHtml() {
    var h = srcBanner() + '<div class="ess-bar"><button class="btn ' + (E.hide ? 'primary' : '') + '" data-act="rev">' + (E.hide ? '👁 Montrer les valeurs' : '🙈 Mode révision (cacher les valeurs)') + '</button>' +
      '<button class="btn" data-act="quiz">🎲 Quiz flash</button></div><div class="ess-grid">';
    TF.DATA.essFiche.forEach(function (c) {
      h += '<div class="ess-card ec-' + c.id + '"><div class="ec-h">' + c.icon + ' ' + esc(c.title) + '</div>';
      if (c.id === 'vit') h += '<div class="asi-leg"><i class="asi asi-white"></i>arc blanc <i class="asi asi-green"></i>arc vert <i class="asi asi-yellow"></i>arc jaune <i class="asi asi-red"></i>trait rouge <i class="asi asi-blue"></i>trait bleu — repères du cadran (OM-B p.24)</div>';
      c.facts.forEach(function (f) {
        h += '<div class="ec-f"><span class="ec-k">' + (f.asi ? '<i class="asi asi-' + f.asi[0] + '" title="' + esc(f.asi[1]) + '"></i>' : '') + esc(f.k) + (f.doubt ? ' <span class="doubt" title="Lecture du manuscrit à confirmer">?</span>' : '') +
          (f.def && !E.hide ? ' <button class="i-btn" data-act="info" title="Définition">i</button>' : '') + '</span>' +
          '<span class="ec-v' + (E.hide ? ' hid' : '') + '" data-act="reveal"><b>' + esc(f.v) + '</b>' + (f.note ? '<small>' + esc(f.note) + '</small>' : '') + '</span>' +
          (f.def && !E.hide ? '<div class="ec-def hidden">ℹ︎ ' + esc(f.def) + '</div>' : '') + '</div>';
      });
      h += '</div>';
    });
    return h + '</div>';
  }
  /* Quiz flash : une question claire, 4 réponses de même unité, explication + source */
  function quiz() {
    var Z = TF.DATA.essQuiz, q = Z[Math.floor(Math.random() * Z.length)];
    if (E._lastQz === q && Z.length > 1) return quiz(); E._lastQz = q;
    var opts = [q.a].concat(q.w).sort(function () { return Math.random() - 0.5; });
    var h = K.head('🎲 Quiz flash — ' + esc(q.cat)) + '<div class="qz-q">' + esc(q.q) + '</div><div class="qz-opts">' +
      opts.map(function (o) { return '<button class="btn big block" data-act="ans" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div><div id="qzFb"></div>';
    K.sheet(h, function (s) {
      K.bindActs(s, {
        ans: function (b) {
          var ok = b.getAttribute('data-v') === q.a, fb = s.querySelector('#qzFb');
          Array.prototype.forEach.call(s.querySelectorAll('[data-act="ans"]'), function (x) { x.disabled = true; if (x.getAttribute('data-v') === q.a) x.classList.add('primary'); });
          if (ok) { K.sound.ok(); TF.Profiles.addXp(1); } else { K.sound.err(); b.classList.add('danger'); }
          fb.innerHTML = '<div class="feedback ' + (ok ? 'ok' : 'err') + '">' + (ok ? '✓ Exact : ' : '✗ La bonne réponse : ') + esc(q.a) + '</div><div class="ct-src">📄 ' + esc(q.s) + '</div><button class="btn primary block" data-act="next">Question suivante ▶</button>';
        },
        next: function () { quiz(); }
      });
    }, { width: '560px' });
  }

  /* -------------------------------------------------------------- Flow -------------------------------------------------------------- */
  function chipHtml(c, state) {
    if (c.call) return '<span class="fchip call' + (state ? ' ' + state : '') + '" title="Annonce orale">🎙 ' + esc(c.call) + '</span>';
    return '<span class="fchip' + (c.ctls ? ' tgt' : ' say') + (c.add ? ' add' : '') + (state ? ' ' + state : '') + '" title="' + esc(c.a + ' … ' + c.r) + '">' + (c.ctls ? '' : '🗣 ') + esc(c.t) + (c.add ? ' <span class="addb">OM-B</span>' : '') + (c.doubt ? ' <span class="doubt">?</span>' : '') + '</span>';
  }
  function flowHtml() {
    var h = srcBanner() + '<div class="ess-intro">Chaque étape tient en quelques mots-clés, relus contre l\'OM-B : <b>une puce = une commande à un endroit</b>. <b>▶ Balayer</b> : l\'instructeur parcourt le cockpit et annonce l\'item en anglais. <b>✋ À toi</b> : touche les commandes dans le même ordre. <span class="addb">OM-B</span> = ajouté depuis l\'OM-B (absent des notes) · <span class="doubt">?</span> = lecture à confirmer.</div><div class="tl">';
    TF.DATA.essFlow.forEach(function (b, i) {

    waitFor(function () { return eng(k).state === 'run'; }, function () { ck.setControl('start_key', 'OFF'); waitFor(function () { return (eng(k).oilP || 0) >= 0.9 * 0.9; }, cb, fast, 4000); }, fast, 12000);
  }
  function runSim(c, fast, cb) {
    cb = cb || function () { };
    var ck = app().ck;
    if (c && c.gate && !TF.evalCond(c.gate, ck.s)) { // étape « au bon moment » : on attend la vitesse / l'altitude
      return waitFor(function () { return TF.evalCond(c.gate, ck.s); }, function () { runSim(c, fast, cb); }, fast, 200000);
    }
    var f = c && c.sim && SIMS[c.sim];
    if (!f) return cb();
    if (f.ops) f = f.ops();
    if (f.length != null && typeof f !== 'function') {
      var PE = TF.ProcEngine, g = S && S.g;
      var clock = fast ? PE.Runner.instantClock(ck) : { advance: function (ms, k) { setTimeout(function () { if (S && S.g === g) { app().view.renderDynamic(true); k(); } }, ms); } };
      new PE.Runner(ck, null, clock).run(f, function () { app().view.renderDynamic(true); cb(); });
      return;
    }
    var r = f(ck, fast, function () { app().view.renderDynamic(true); cb(); });
    if (f.length < 3) { app().view.renderDynamic(true); cb(); }
  }
  function alive(g) { return function () { return S && S.g === g; }; }
  function demoStep() {
    var g = S.g, al = alive(g), b = S.b, v = app().view;
    if (S.i >= b.chips.length) { S.finished = true; E.renderPanel(); return; }
    var c = b.chips[S.i];
    setUi(c);
    E.renderPanel();
    v.clearHighlight();
    if (c.gate && !TF.evalCond(c.gate, app().ck.s)) { // étape « au bon moment » : on attend la vitesse / l'altitude, puis on annonce
      waitFor(function () { return TF.evalCond(c.gate, app().ck.s); }, function () { if (al()) demoStep(); }, false, 200000); return;
    }
    if (c.ctls) {
      v.focusOn(c.ctls[0]);
      ses().dWait(450, function () {
        c.ctls.forEach(function (t) { v.highlight(t, 'pulse'); });
        if (S.prev) v.path(S.prev, c.ctls[0]);
        S.prev = c.ctls[c.ctls.length - 1];
      }, al);
    }
    if (c.call) K.toast('🎙 Annonce : « ' + esc(c.call) + ' »', 'call', 2600);
    ses().dSay(c.say, 'en', function () {
      runSim(c, false, function () { if (!al()) return; S.done.push(S.i); S.i++; ses().dWait(c.ctls ? 500 : 250, demoStep, al); });
    }, null, al);
  }
  function tryFocus() {
    if (!S) return;
    var c = S.b.chips[S.i];
    E.renderPanel();
    if (!c) { S.finished = true; finishTry(); return; }
  }
  function finishTry() {
    var n = S.b.chips.filter(function (c) { return c.ctls; }).length, err = S.errors;
    if (!err) { K.sound.ok(); TF.Profiles.addXp(5); K.toast('🎯 Flow « ' + esc(S.b.title) + ' » sans erreur : +5 XP', 'ok', 2200); }
    else TF.Profiles.addXp(2);

  }
  function advanceTry() {
    var cur = S.b.chips[S.i];

    S.done.push(S.i); S.i++; S.chipErr = 0;
    runSim(cur, false, function () { if (S) { setUi(S.b.chips[S.i]); E.renderPanel(); } });
    setUi(S.b.chips[S.i]);

    setTimeout(function () {
      if (!S) return;
      v.clearHighlight();
      var curReg = S.lastRegion, nr = next && next.ctls ? regionOf(next.ctls[0]) : null;

  function regionOf(id) { var d = app().ck.defs[id]; return d ? d.region : id; }
  /* Touche dans le cockpit pendant « À toi » : on vérifie sans manipuler la commande */
  E.intercept = function (kind, id) {

    var hit = c.ctls.indexOf(id) >= 0;

    if (hit) {

  };
  /* Bouton « 🎙 Annonce » de la barre d'outils pendant « À toi » : valide l'annonce attendue */
  E.onCallout = function () {

  E.renderPanel = function () {

    h += '<div class="sc-note" style="margin:-2px 0 8px">' + esc(b.sub) + '</div><div class="clc"><div class="clc-top"><span>FLOW — ' + esc(b.title).toUpperCase() + '</span></div><div class="clc-list">';
    b.chips.forEach(function (c, i) {
      var st = S.done.indexOf(i) >= 0 ? ' ok' : i === S.i && !S.finished ? ' cur' : '';
      if (c.call) {

        h += '<div class="clc-row ess-call' + st + '" data-act="goto" data-i="' + i + '"><span class="clc-n">' + (i + 1) + '</span><span class="clc-l"><span class="call-tag">🎙 ANNONCE</span><b class="call-txt">« ' + esc(c.call) + ' »</b>' +
          (/CHECK-LIST/.test(c.r) ? '<small class="ess-act">puis <b>' + esc(c.call.replace(/ procedure complete$/i, '')) + ' check-list … DONE</b></small>' : '') + (c.om ? '<small class="ess-act"><i class="ess-om">OM-B ' + esc(c.om) + '</i></small>' : '') + '</span><span class="clc-r">' + (st === ' ok' ? '✓' : '🎙') + '</span>';

        if (c.vals) h += '<div class="kv-row">' + c.vals.map(function (v) { return '<span class="kv">' + esc(v) + '</span>'; }).join('') + '</div>';
        if (st === ' cur' && c.note) h += '<div class="clc-acts"><div class="sc-note">' + esc(c.note) + '</div></div>';
        if (st === ' cur' && S.mode === 'try' && !c.ctls) h += '<div class="clc-acts"><button class="btn primary" data-act="said">✓ Fait</button></div>';
        h += '</div>'; return;
      }

        '<small class="ess-act">' + esc(c.a) + ' … <b>' + esc(c.r) + '</b>' + (c.om ? ' <i class="ess-om' + (c.moved ? ' mv' : '') + '">OM-B ' + esc(c.om) + (c.moved ? ' · ordre déplacé' : '') + '</i>' : '') + '</small></span><span class="clc-r">' + (st === ' ok' ? '✓' : tgt) + '</span>';
      if (c.vals) h += '<div class="kv-row">' + c.vals.map(function (v) { return '<span class="kv">' + esc(v) + '</span>'; }).join('') + '</div>';

        (nxt ? '<button class="btn" data-act="nextb" data-id="' + nxt.id + '">' + nxt.icon + ' Suivant ▶</button>' : '') + '</div>';
      if (S.mode === 'try') h += '<button class="btn block" data-act="demo">▶ Revoir le balayage</button>';

    K.centerCurrent(bdy.querySelector('.clc-list'), bdy.querySelector('.clc-row.cur'));

  /* ----------------------------------------------------------- Tour avion ----------------------------------------------------------- */
  function planeSvg(cur) {

        '<text x="' + w.x + '" y="' + (w.y + 6) + '" text-anchor="middle" font-size="17" font-weight="800" fill="' + (on ? '#1a1200' : '#fff') + '" font-family="-apple-system,Helvetica,Arial,sans-serif">' + w.n + '</text></g>';
    });

<script>/* js/ui/checklist-ui.js */
/* Interface — module CHECK-LISTS (distinct des flows), méthode PDP « Use of check-list » p.101-104 :
 * appel de la C/L, lecture de chaque item, contrôle réel, réponse, confirmation, « … C/L COMPLETE », C/L suivante.
 * Découvrir : lecture commentée automatique ; S'entraîner : accompagnée ; De mémoire : autonome.
 * Les C/L « bold line » (AFTER TAKEOFF, FINAL) se disent par cœur (PDP p.102) : libellés masqués en mode mémoire.
 */
(function (root) {
  'use strict';
  var TF = root.TF, K = TF.UI, esc = TF.util.esc, V = TF.Voice;

  function CL(app) { this.app = app; this.run = null; this.await = -1; this.msg = null; }
  var P = CL.prototype;
  function byId(id) { return TF.DATA.checklists.filter(function (c) { return c.id === id; })[0]; }

  P.active = function () { return !!this.run; };
  P.start = function (id, level, onDone) {
    var def = byId(id); if (!def) return;
    this.level = level; this.onDone = onDone;
    this.run = new TF.ChecklistRun(def, this.app.ck, level === 'memory' ? 'autonomous' : 'accompanied');
    this.await = -1; this.msg = null; this.nextCalled = false; this.gen = (this.gen || 0) + 1;
    K.closeSheet(); this.render();
    if (level === 'discover') this.autoplay();
    else if (level === 'memory') V.say('À toi : check-list ' + def.title + ', de mémoire.', 'fr');
  };
  P.stop = function () { this.run = null; this.await = -1; this.gen = (this.gen || 0) + 1; this.app.view.clearHighlight(); };
  P.expectedCallout = function () {
    var r = this.run; if (!r) return null;
    if (!r.calledStart) return r.def.call;
    if (r.done() && !r.calledComplete) return r.def.complete;
    if (r.calledComplete && !this.nextCalled) return 'Next C/L will be ' + r.def.nextName;
    return null;
  };
  P.onCallout = function (text) {
    var r = this.run; if (!r) return false;
    var exp = this.expectedCallout();
    if (!r.calledStart) r.calledStart = true;
    else if (r.done() && !r.calledComplete) r.calledComplete = true;
    else if (r.calledComplete && !this.nextCalled) this.nextCalled = true;
    else return false;
    this.msg = { k: 'ok', m: 'Annonce enregistrée.' };
    if (this.level === 'practice' && exp) V.say(exp, 'en');
    this.render(); return true;
  };
  P.targetOf = function (i) { var v = this.run.def.items[i].verify; return v.ctl || v.zone || null; };

  /* « Regarder » en autonome : la prochaine touche cockpit désigne l'élément contrôlé */
  P.intercept = function (kind, id) {
    if (this.await < 0 || kind === 'press') return false;
    var i = this.await, tg = this.targetOf(i), v = this.run.def.items[i].verify;
    var hit = kind === 'ctl' ? (id === v.ctl || (v.zone && this.app.ck.defs[id] && this.app.ck.defs[id].region === v.zone)) : (kind === 'ind' && (id === v.zone || (v.zone === 'cb_panel' && id === 'cb_bottom') || (v.zone === 'botM' && id === 'gear_lights')));
    this.await = -1;
    if (hit) { var r = this.run.look(i); this.msg = { k: r.conform === false ? 'err' : 'info', m: '👁 ' + esc(r.seen) }; this.app.view.clearHighlight(); this.app.view.highlight(tg || id, r.conform === false ? 'err' : 'ok'); }
    else { this.run.aid(i); this.msg = { k: 'err', m: 'Ce n\'est pas l\'élément de « ' + esc(this.run.def.items[i].label) + ' ». Réessaie (compté comme aide).' }; }
    this.render(); return true;
  };
  P.onObserve = function () { };
  P.onConfirmItem = function () { };

  P.look = function (i) {
    var r = this.run, tg = this.targetOf(i), v = this.app.view;
    if (r.mode === 'accompanied') {
      var res = r.look(i);
      v.clearHighlight(); if (tg) { v.focusOn(tg); v.highlight(tg, res.conform === false ? 'err' : 'pulse'); }
      this.msg = { k: res.conform === false ? 'err' : 'info', m: '👁 ' + esc(res.seen) + (res.conform === false ? ' — corrige dans le cockpit puis re-regarde.' : '') };
    } else if (!tg) { var rr = r.look(i); this.msg = { k: 'info', m: esc(rr.seen) }; }
    else { this.await = i; this.msg = null; }
    this.render();
  };
  P.confirm = function (i) {
    var r = this.run, d = r.def, res = r.confirm(i);
    if (res.ok) { K.sound.ok(); this.msg = { k: 'ok', m: '✓ ' + esc(d.items[i].label) + ' … ' + esc(d.items[i].resp) }; this.app.view.clearHighlight(); if (this.level === 'practice') V.say(d.items[i].label.replace(/\(.*?\)/g, '') + '. ' + d.items[i].resp + '.', 'en'); }
    else { K.sound.err(); this.msg = { k: 'err', m: esc(res.reason) }; }
    this.render();
  };

  /* Découvrir : lecture automatique challenge / réponse */
  P.autoplay = function () {
    var self = this, my = this.gen, r = this.run, d = r.def, i = 0, v = this.app.view, ses = this.app.modes;
    function alive() { return self.gen === my && !!self.run; }
    function say(t, cb) { ses.dSay(t, 'en', cb, null, alive); }
    say(d.call, function () { r.calledStart = true; self.render(); step(); });
    function step() {
      if (!alive()) return;
      if (i >= d.items.length) {
        say(d.complete, function () { r.calledComplete = true; self.render();
          say('Next C/L will be ' + d.nextName, function () { self.nextCalled = true; self.render(); ses.dWait(600, function () { self.end(); }, alive); }); });
        return;
      }
      var it = d.items[i], tg = self.targetOf(i);
      r.look(i); if (tg) { v.focusOn(tg); v.clearHighlight(); v.highlight(tg, 'pulse'); }
      self.render();
      say(it.label.replace(/\(.*?\)/g, '') + '. ' + it.resp + '.', function () {
        r.respond(i, false); var c = r.confirm(i);
        if (!c.ok) { r.items[i].confirmed = true; r.items[i].nonConformSeen = true; }
        if (r.idx === i) r.idx = i + 1;
        i++; self.render(); ses.dWait(250, step, alive);
      });
    }
  };

  /* Carte de check-list « papier » : appel, items, COMPLETE, check-list suivante.
   * Ligne en cours encadrée (avec ses actions), lignes faites en vert, la ligne d'avant et d'après restent visibles. */
  P.render = function () {
    var r = this.run, b = K.$('instrBody'); if (!r) return;
    var d = r.def, auto = r.mode === 'autonomous', heart = d.byHeart && auto, self = this, ses = this.app.modes, h = ses.phase ? ses.headerHtml() : '';
    var disc = this.level === 'discover', done = r.done();
    function callRow(state, text, hidden) {
      var cls = state === 'done' ? ' ok' : state === 'cur' ? ' cur' : '';
      var x = '<div class="clc-row call' + cls + '"><span class="clc-n">🎙</span><span class="clc-l">' + (hidden ? '<i>annonce</i>' : '« ' + esc(text) + ' »') + '</span><span class="clc-r">' + (state === 'done' ? '✓' : 'ANNONCE') + '</span></div>';
      if (state === 'cur' && !disc) x = x.replace(/<\/div>$/, '<div class="clc-acts"><button class="btn primary block" data-act="call">✅ J\'ai fait l\'annonce</button></div></div>');
      return x;
    }
    h += '<div class="clc"><div class="clc-top"><span>' + esc(d.title) + ' CHECK-LIST</span>' + (d.byHeart ? '<em>par cœur</em>' : '') + '</div>';
    h += '<div class="clc-src">' + esc(TF.refText(d.ref)) + '</div>';
    if (d.divergence) { var dv = TF.DATA.divergences.filter(function (x) { return x.id === d.divergence; })[0]; h += '<div class="caution" style="font-size:11.5px;margin:6px 8px"><b>' + dv.id + '</b> — ' + esc(dv.decision) + '</div>'; }
    h += '<div class="clc-list">';
    h += callRow(r.calledStart ? 'done' : 'cur', d.call, auto);
    d.items.forEach(function (it, i) {
      var st = r.items[i], cur = r.calledStart && i === r.idx && !st.confirmed;
      if (it.line) h += '<div class="cl-line">BELOW THE LINE</div>';
      var showLab = !heart || st.confirmed || st.looked, showResp = !auto || st.responded || st.confirmed;
      h += '<div class="clc-row' + (cur ? ' cur' : '') + (st.confirmed ? (st.nonConformSeen ? ' warn' : ' ok') : '') + '"><span class="clc-n">' + (i + 1) + '</span><span class="clc-l">' + (showLab ? esc(it.label) : '· · ·') + '</span><span class="clc-r">' + (showResp ? esc(it.resp) + (it.sic ? ' <small>[sic]</small>' : '') : '· · ·') + (st.confirmed ? ' ✓' : '') + '</span>';
      if (cur && !disc) {
        var kind = r.inspect(i).kind;
        h += '<div class="clc-acts">';
        if (kind !== 'declarative' || it.verify.zone) h += '<button class="btn" data-act="look" data-i="' + i + '">👁 ' + (st.looked ? 'Re-regarder' : 'Regarder') + '</button>';
        if (!st.responded) h += '<button class="btn" data-act="resp" data-i="' + i + '">🗣 J\'ai répondu</button>' + (auto ? '<button class="btn" data-act="reveal" data-i="' + i + '">Révéler</button>' : '');
        h += '<button class="btn primary" data-act="conf" data-i="' + i + '">✓ Confirmer</button>';
        if (st.seen) h += '<div class="sc-note">Constaté : ' + esc(st.seen) + '</div>';
        if (kind === 'declarative') h += '<div class="toconfirm">Vérification déclarative (non simulée)</div>';
        h += '</div>';
      }
      h += '</div>';
    });
    h += callRow(r.calledComplete ? 'done' : (done ? 'cur' : ''), d.complete, auto);
    h += callRow(this.nextCalled ? 'done' : (r.calledComplete ? 'cur' : ''), 'Next C/L will be ' + d.nextName, auto);
    h += '</div></div>';
    if (this.await >= 0) h += '<div class="feedback info">Touche dans le cockpit l\'élément de « ' + esc(heart ? 'item ' + (this.await + 1) : d.items[this.await].label) + ' ».</div>';
    if (this.msg) h += '<div class="feedback ' + this.msg.k + '">' + this.msg.m + '</div>';
    if (done && !disc && this.nextCalled) h += '<button class="btn primary big block" data-act="end">Check-list terminée ▶</button>';
    if (disc && ses.phase) h += ses.demoControls();
    h += '<button class="btn link" data-act="quit">Quitter la séance</button>';
    b.innerHTML = K.plain(h);
    TF.UI.centerCurrent(b.querySelector('.clc-list'), b.querySelector('.clc-row.cur'));
    K.bindActs(b, {
      call: function () { TF.Interact.declareCallout(); },
      look: function (el) { self.look(+el.getAttribute('data-i')); },
      resp: function (el) { r.respond(+el.getAttribute('data-i'), false); self.render(); },
      reveal: function (el) { r.respond(+el.getAttribute('data-i'), true); self.render(); },
      conf: function (el) { self.confirm(+el.getAttribute('data-i')); },
      end: function () { self.end(); },
      pause: function () { ses.togglePause(); }, speed: function (el) { ses.setDemoSpeed(+el.getAttribute('data-v')); },
      toPractice: function () { self.stop(); ses.startPhase(ses.phase.id, 'practice', ses.idx); },
      quit: function () { self.stop(); ses.idle(); TF.Home.show(); }
    });
  };
  P.end = function () {
    var res = this.run.result(), cb = this.onDone;
    TF.Profiles.recordChecklist(res);
    this.stop();
    if (cb) cb(res);
  };
  TF.ChecklistUI = CL;
})(this);

</script>
<script>/* js/ui/screens.js */
/* Interface — écrans : accueil, bibliothèque d'entraînement, débriefing, briefing, profil, prochain vol, base documentaire. */
(function (root) {
  'use strict';
  var TF = root.TF, K = TF.UI, esc = TF.util.esc, PE = TF.ProcEngine;
  var S = TF.Screens = {};
  var app;
  S.init = function (a) { app = a; };
  var ST = {
    ok: ['✓ Réussie', 's-ok'], ok_aided: ['✓ Avec aide', 's-aid'], omitted: ['✗ Oubliée', 's-om'], wrong: ['✗ Incorrecte', 's-err'],
    changed: ['✗ Position modifiée ensuite', 's-err'], order: ['✗ Ordre prescrit', 's-err'], invalid: ['✗ Non conforme', 's-err'], na: ['— Non requise', 's-na']
  };

  /* ---------------- Accueil : choix du pilote ---------------- */
  S.splash = function (onPick) {

      h += '<button class="sp-pilot" data-act="pick" data-id="' + p.id + '"><div class="sp-av">' + esc(p.name[0]) + '</div><b>' + esc(p.name) + '</b><small>' + (n ? n + ' flow' + (n > 1 ? 's' : '') + ' travaillé' + (n > 1 ? 's' : '') : 'Nouveau') + '</small></button>';
    });
    h += '</div><div class="sp-warn">Outil pédagogique d\'entraînement au sol. Ne remplace jamais l\'AFM, l\'OM-B, la documentation approuvée ni les instructions de l\'ATO.<br>Sources : OM-B DA42 VI Issue C (nov. 2023) · C/L DA42-VI Issue C · PDP V1.2 · Garmin G1000 NXi Pilot\'s Guide.' + (TF.Profiles.isPersistent() ? '' : '<br><b style="color:#ffc93c">Stockage local indisponible : la progression ne sera pas conservée (exporte tes résultats).</b>') + '</div></div>';
    el.innerHTML = h; el.classList.remove('gone');
    K.bindActs(el, { pick: function (b) { TF.Profiles.select(b.getAttribute('data-id')); el.classList.add('gone'); if (onPick) onPick(); } });
  };

  /* ---------------- Bibliothèque d'entraînement ---------------- */
  S.menu = function () {
    var p = TF.Profiles.current(), plan = TF.Trainer.plan(p, 10), m = app.modes;
    var h = K.head('Entraînement — ' + esc(p.name));
    h += '<div class="sh-sec">Flows (OM-B B02 §3)</div><div class="grid">';
    TF.DATA.procedures.forEach(function (pr) {
      var ms = Math.round(TF.Trainer.mastery(p, pr.id) * 100), st = p.procs[pr.id];
      h += '<div class="cell"><div class="tile"><h3>' + esc(pr.title) + '</h3><p>' + esc(pr.fullTitle) + '<br>' + pr.steps.length + ' étapes · ' + esc(TF.refText(pr.ref)) + '</p>' +
        '<div class="mbar" style="margin-bottom:6px"><i style="width:' + ms + '%"></i></div><p style="margin-bottom:8px">Maîtrise ' + ms + ' %' + (st ? ' · ' + st.attempts + ' essai(s) · ' + st.perfectMemory + ' parfait(s) de mémoire' : '') + '</p>' +
        '<div class="row"><button class="btn" data-act="go" data-id="' + pr.id + '" data-mode="demo">Démo</button><button class="btn" data-act="go" data-id="' + pr.id + '" data-mode="guided">Guidé</button><button class="btn primary" data-act="go" data-id="' + pr.id + '" data-mode="memory">Mémoire</button></div></div></div>';
    });
    h += '</div><div class="sh-sec">Checklists (C/L DA42-VI Issue C)</div><div class="grid">';
    TF.DATA.checklists.forEach(function (c) {
      h += '<div class="cell"><div class="tile"><h3>' + esc(c.title) + '</h3><p>' + c.items.length + ' items · lue, jamais récitée</p><div class="row"><button class="btn" data-act="cl" data-id="' + c.id + '" data-mode="accompanied">Accompagnée</button><button class="btn primary" data-act="cl" data-id="' + c.id + '" data-mode="autonomous">Autonome</button></div></div></div>';
    });
    h += '<div class="cell"><div class="tile"><h3>Chair flying</h3><p>Mise en route complète de mémoire, états conservés : BEFORE START → C/L → START-UP → AFTER START → C/L.</p><button class="btn gold" data-act="chain">Lancer l\'enchaînement</button></div></div>';
    h += '</div><div class="sh-sec">Sessions</div><div class="grid">';
    TF.Trainer.SESSIONS.forEach(function (s) { h += '<div class="cell"><div class="tile"><h3>' + s.minutes + ' min · ' + esc(s.label) + '</h3><p>' + esc(s.desc) + '</p><button class="btn primary" data-act="sess" data-id="' + s.id + '">Démarrer</button></div></div>'; });
    h += '<div class="cell"><div class="tile"><h3>Examen instructeur</h3><p>Une situation documentée, sans aide : identifie la procédure et exécute-la. Compte rendu précis.</p><button class="btn danger" data-act="exam">Commencer</button></div></div>';
    h += '<div class="cell"><div class="tile"><h3>Revoir mes erreurs</h3><p>Étapes ratées récemment, rejouées une par une dans leur contexte.</p><button class="btn" data-act="errs">Lancer</button></div></div>';
    h += '</div><div class="sh-sec">Priorités suggérées</div><div class="card">';
    plan.slice(0, 3).forEach(function (x) { h += '<div class="kv"><span>' + esc(PE.procById(x.proc).title) + ' — ' + esc(x.reason) + '</span><span><button class="btn" style="margin:0" data-act="go" data-id="' + x.proc + '" data-mode="' + x.mode + '">' + (x.mode === 'memory' ? 'Mémoire' : 'Guidé') + '</button></span></div>'; });
    h += '</div><div class="sh-sec">Scénario et réglages</div>' + scenarioForm(p);
    K.sheet(h, function (s) {
      K.bindActs(s, {
        go: function (b) { m.start(b.getAttribute('data-id'), b.getAttribute('data-mode')); },
        cl: function (b) { app.ck.reset(app.scenario()); app.ck.restore(PE.buildInitial(b.getAttribute('data-id') === 'cl-before-start' ? 'after-before-start' : 'after-start-full', app.scenario())); app.view.renderAll(); app.checklistUI.start(b.getAttribute('data-id'), b.getAttribute('data-mode')); m.render(); },
        chain: function () { S.startChainStartup(m); },
        sess: function (b) { S.session(b.getAttribute('data-id')); },
        exam: function () { K.closeSheet(); m.startExam(); },
        errs: function () { S.reviewErrors(); },
        seg: function (b) { segClick(b, p); }
      });
      bindScenario(s, p);
    });
  };
  function scenarioForm(p) {
    var sc = app.scenario(), lv = p.settings.calloutLevel || 'guided';
    var h = '<div class="card"><div class="lbl">Niveau des annonces</div><div style="margin:6px 0 10px">';
    h += '<span class="seg">' + [['beginner', 'Débutant (texte affiché)'], ['guided', 'Guidé (annonce attendue)'], ['autonomous', 'Autonome']].map(function (x) { return '<button data-act="seg" data-k="calloutLevel" data-v="' + x[0] + '" class="' + (lv === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</span></div>';
    h += '<div class="lbl">Scénario (« AS REQUIRED » / « only in IFR » / « first flight »)</div>';
    [['ifr', 'Vol IFR'], ['icingExpected', 'Conditions givrantes prévues'], ['firstFlightOfDay', 'Premier vol de la journée'], ['coldEngine', 'Moteurs froids (GLOW)']].forEach(function (x) {
      h += '<label class="chk"><input type="checkbox" data-sc="' + x[0] + '"' + (sc[x[0]] ? ' checked' : '') + '>' + x[1] + '</label>';
    });
    h += '<div class="lbl" style="margin-top:8px">Avion</div><span class="seg">' + TF.DATA.aircraft.fleet.map(function (f) { return '<button data-act="seg" data-k="reg" data-v="' + f.reg + '" class="' + (sc.reg === f.reg ? 'on' : '') + '">' + f.reg + '</button>'; }).join('') + '</span>';
    h += '<div class="explain" style="font-size:12px">Carburant jaugé : ' + sc.fuelMain[0] + ' / ' + sc.fuelMain[1] + ' USG · calculateur FMS non recalé : ' + sc.fmsFuelInitial + ' (valeurs de la photo PDP p.118).</div></div>';
    return h;
  }
  function segClick(b, p) {
    var k = b.getAttribute('data-k'), v = b.getAttribute('data-v');
    if (k === 'calloutLevel') TF.Profiles.setSetting('calloutLevel', v);
    else { var sc = app.scenario(); sc[k] = v; app.setScenario(sc); }
    Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); });
  }
  function bindScenario(s, p) {
    Array.prototype.forEach.call(s.querySelectorAll('[data-sc]'), function (c) {
      c.onchange = function () { var sc = app.scenario(); sc[c.getAttribute('data-sc')] = c.checked; app.setScenario(sc); };
    });
  }

  /* ---------------- Sessions ---------------- */
  S.session = function (id) {
    var p = TF.Profiles.current(), m = app.modes;
    if (id === 'flash') { var it = TF.Trainer.flashSteps(p, 6); return m.startDrill(it, 'Mémorisation flash (3 min)'); }
    if (id === 'repeat') {
      var plan = TF.Trainer.plan(p, 10).slice(0, 2);
      return m.startChain(plan.map(function (x) { return { type: 'proc', id: x.proc, mode: 'memory' }; }), 'Répétition des flows (10 min)');
    }
    if (id === 'prep') {
      var f = p.flights[p.nextFlight] || { procs: [] }, procs = f.procs.filter(function (x) { return PE.procById(x); });
      if (!procs.length) procs = TF.DATA.procedures.map(function (x) { return x.id; });
      return S.startChainFor(procs, 'Préparation : ' + labelFlight(p.nextFlight));
    }
  };
  S.startChainFor = function (procs, title) {
    var items = [];
    var order = TF.DATA.procedures.map(function (x) { return x.id; }).filter(function (id) { return procs.indexOf(id) >= 0; });
    order.forEach(function (id) { var pr = PE.procById(id); items.push({ type: 'proc', id: id, mode: 'memory' }); if (pr.next && pr.next.checklist) items.push({ type: 'cl', id: pr.next.checklist, mode: 'autonomous' }); });

  };
  S.startChainStartup = function (m) {

  };
  S.reviewErrors = function () {
    var p = TF.Profiles.current(), items = [];
    TF.Profiles.frequentErrors(p, 8).forEach(function (e) { var a = e.key.split('/'); if (e.box <= 2) items.push({ proc: a[0], step: a[1] }); });
    items = items.filter(function (x) { var st = PE.stepById(PE.procById(x.proc), x.step); return st && st.kind !== 'callout' && st.kind !== 'constraint'; });
    app.modes.startDrill(items, 'Revoir mes erreurs');
  };
  S.chainSummary = function (c, m) {
    var h = K.head('Enchaînement terminé — ' + esc(c.title));
    h += '<table class="t"><tr><th>Étape</th><th>Résultat</th></tr>';
    c.results.forEach(function (r, i) {
      var it = c.items[i];
      var name = it.type === 'proc' ? PE.procById(it.id).title : 'C/L ' + TF.DATA.checklists.filter(function (x) { return x.id === it.id; })[0].title;
      var txt = r.checklist ? r.noAid + '/' + r.total + ' items sans aide' : r.okNoAid + '/' + r.total + ' actions sans aide' + (r.perfect ? ' · parfait' : '');
      h += '<tr><td>' + esc(name) + '</td><td class="st ' + ((r.perfect || (r.checklist && r.noAid === r.total)) ? 's-ok' : 's-om') + '">' + esc(txt) + '</td></tr>';
    });
    h += '</table><div style="margin-top:14px"><button class="btn primary" data-act="again">Recommencer l\'enchaînement</button><button class="btn" data-act="close">Fermer</button></div>';
    var items = c.items, title = c.title;
    K.sheet(h, function (s) { K.bindActs(s, { again: function () { K.closeSheet(); m.startChain(items, title); }, close: function () { K.closeSheet(); m.free(); } }); });
  };

  /* ---------------- Débriefing ---------------- */
  S.debrief = function (res, proc, m) {
    var h = K.head('Débriefing — ' + esc(proc.title) + ' <span style="font-size:13px;color:#8fa1b8">(' + ({ memory: 'mémoire', guided: 'guidé', exam: 'examen', demo: 'démo', drill: 'exercice' }[res.mode] || res.mode) + ')</span>');
    if (res.mode === 'exam') h += '<div class="caution" style="margin-bottom:10px">' + (res.identifiedOk ? '✓ Procédure correctement identifiée.' : '✗ Procédure identifiée : <b>' + esc(res.identified ? PE.procById(res.identified).title : 'aucune') + '</b> — attendue : <b>' + esc(proc.title) + '</b>.') + ' Compte rendu d\'entraînement, pas une évaluation réglementaire.</div>';
    h += '<div class="summary">' + esc(TF.Trainer.summary(res)) + '</div>';
    var aided = res.steps.filter(function (s) { return s.status === 'ok_aided'; }).length;
    h += '<div class="grid g5"><div class="cell"><div class="tile stat ok"><b>' + res.okNoAid + '</b><span>sans aide</span></div></div><div class="cell"><div class="tile stat cy"><b>' + aided + '</b><span>avec aide</span></div></div><div class="cell"><div class="tile stat warn"><b>' + res.omitted + '</b><span>oubliées</span></div></div><div class="cell"><div class="tile stat err"><b>' + res.errors + '</b><span>erreurs</span></div></div><div class="cell"><div class="tile stat"><b>' + res.orderRemarks.length + '</b><span>remarques d\'ordre</span></div></div></div>';
    if (res.critical.length) h += '<div class="feedback err" style="margin-top:10px">⚠ ' + res.critical.map(esc).join('<br>') + '</div>';
    h += '<div class="sh-sec">Détail des étapes (ordre OM-B)</div><table class="t"><tr><th>#</th><th>Étape</th><th>Attendu</th><th>Résultat</th><th>Référence</th></tr>';
    res.steps.forEach(function (r) {
      var st = r.step, lab = ST[r.status] || [r.status, ''];
      h += '<tr><td>' + esc(st.n) + '</td><td>' + esc(st.kind === 'callout' ? 'Annonce' : st.label) + (r.notes.length ? '<div class="explain" style="font-size:11.5px;margin-top:2px">' + r.notes.map(esc).join(' · ') + '</div>' : '') + '</td><td>' + esc(st.response) + '</td><td class="st ' + lab[1] + '">' + lab[0] + (st.kind === 'callout' && r.status === 'ok' ? ' <small>(auto-évaluée)</small>' : '') + '</td><td style="font-size:11px;color:#8fb3d9">' + esc(TF.refText(st.ref)) + '</td></tr>';
    });
    h += '</table>';
    if (res.extraneous.length) {
      h += '<div class="sh-sec">Actions hors procédure</div><table class="t"><tr><th>Commande</th><th>État final</th><th>Commentaire</th></tr>';
      res.extraneous.forEach(function (x) { h += '<tr><td>' + esc(x.label) + '</td><td>' + esc(x.final) + (x.leftChanged ? ' <span class="s-err">(initial : ' + esc(x.initial) + ')</span>' : '') + '</td><td>' + (x.belongsTo.length ? 'Appartient à : ' + esc(x.belongsTo.join(', ')) : 'Hors de cette procédure') + (x.leftChanged ? ' · laissée modifiée' : '') + '</td></tr>'; });
      h += '</table>';
    }
    var calls = res.steps.filter(function (r) { return r.step.kind === 'callout'; });

    h += '<tr><td>Flotte</td><td>' + TF.DATA.aircraft.fleet.map(function (f) { return f.reg + ' (MSN ' + f.msn + ')'; }).join(', ') + '</td><td style="font-size:11px">' + esc(TF.refText(TF.DATA.aircraft.fleetRef)) + '</td></tr>';
    TF.DATA.aircraft.facts.forEach(function (f) { h += '<tr><td>' + esc(f.k) + '</td><td>' + esc(f.v) + '</td><td style="font-size:11px">' + esc(TF.refText(f.ref)) + '</td></tr>'; });
    h += '</table><div class="sh-sec">Divergences documentaires (signalées, non résolues arbitrairement)</div><table class="t"><tr><th>#</th><th>Sujet</th><th>Écart</th><th>Application</th></tr>';
    TF.DATA.divergences.forEach(function (d) { h += '<tr><td>' + d.id + '</td><td>' + esc(d.topic) + '</td><td style="font-size:12px">' + esc(d.a.doc) + ' : ' + esc(d.a.text) + '<br>' + esc(d.b.doc) + ' : ' + esc(d.b.text) + '</td><td style="font-size:12px">' + esc(d.decision) + '</td></tr>'; });
    h += '</table><div class="sh-sec">À confirmer / données manquantes</div><table class="t"><tr><th>#</th><th>Besoin</th><th>Pourquoi</th></tr>';
    TF.DATA.toConfirm.forEach(function (c) { h += '<tr><td>' + c.id + '</td><td>' + esc(c.what) + '</td><td style="font-size:12px">' + esc(c.why) + '</td></tr>'; });
    h += '</table><div class="sh-sec">Traçabilité des étapes</div>';
    TF.DATA.procedures.forEach(function (pr) {
      h += '<div class="card"><b>' + esc(pr.fullTitle) + '</b><table class="t" style="margin-top:6px"><tr><th>#</th><th>Item</th><th>Réponse</th><th>Type</th><th>Source</th></tr>';
      pr.steps.forEach(function (s) { h += '<tr><td>' + esc(s.n) + '</td><td>' + esc(s.label) + (s.toConfirm ? ' <span class="toconfirm">' + s.toConfirm + '</span>' : '') + '</td><td>' + esc(s.response) + '</td><td>' + esc(s.kind) + '</td><td style="font-size:11px">' + esc(TF.refText(s.ref)) + '</td></tr>'; });
      h += '</table></div>';
    });
    h += '<p class="explain" style="margin-top:12px">Simplifications pédagogiques : durées d\'alignement AHRS, de préchauffage et d\'auto-test AFCS raccourcies ; valeurs moteur reprises des photos d\'écrans PDP ; carte, radios et pages G1000 non utilisées par les procédures non simulées (signalées à l\'écran). Version ' + TF.VERSION + '.</p>';
    K.sheet(h, null, { width: '1080px' });
  };
})(this);

</script>
<script>/* js/ui/app.js */
/* Démarrage de l'application : assemblage des modules A–F, boucle temps réel, barre d'outils. */
(function (root) {
  'use strict';
  var TF = root.TF, K = TF.UI, esc = TF.util.esc;

  function setVh() { document.documentElement.style.setProperty('--vh', (root.innerHeight * 0.01) + 'px'); }
  setVh(); root.addEventListener('resize', setVh);

  var scenario = TF.util.clone(TF.DATA.defaultScenario);
  try { var sv = root.localStorage && root.localStorage.getItem('tiffanir.scenario'); if (sv) { var o = JSON.parse(sv); for (var k in o) scenario[k] = o[k]; } } catch (e) { }

  var app = TF.app = {
    scenario: function () { return TF.util.clone(scenario); },
    setScenario: function (sc) {
      scenario = sc; try { root.localStorage.setItem('tiffanir.scenario', JSON.stringify(sc)); } catch (e) { }
      app.ck.s.scenario = TF.util.clone(sc); app.view.renderAll(); app.modes.render();
    }
  };
  app.ck = new TF.Cockpit(scenario);
  app.view = new TF.CockpitView(K.$('ck'), app.ck);
  app.modes = new TF.Session(app);
  app.ck.flightRate = function () { return app.modes.flightRate(); };
  app.checklistUI = new TF.ChecklistUI(app);
  TF.Interact.init(app);
  TF.Screens.init(app);

  /* Boucle temps réel (10 Hz) */
  var last = Date.now();
  setInterval(function () { var now = Date.now(), dt = Math.min(500, now - last); last = now; app.ck.tick(dt); sysNotes(); if (app.modes.pollWindow) app.modes.pollWindow(); }, 100);

  /* Sons et notes système */
  app.ck.on('aural', function (k) { if (k === 'apdisc') K.sound.apdisc(); });
  var noteEl = K.$('sysNote');
  function sysNotes() {
    var I = app.ck.indications(), n = [];
    if (I.aural) K.sound.start('fire'); else K.sound.stop('fire');
    if (I.alerts.warnings.indexOf('CHECK GEAR') >= 0) K.sound.start('horn'); else K.sound.stop('horn');
    if (I.hydPump) n.push('🔊 Pompe hydraulique du train en fonctionnement (OM-B : 5 à 20 s) — durée pédagogique');
    if (I.pfdStage === 'align') n.push('AHRS ALIGN — durée raccourcie (pédagogique)');
    if (I.eng.L.glow || I.eng.R.glow) n.push('Préchauffage GLOW — durée pédagogique');
    if (I.ap.state === 'pft') n.push('Auto-test AFCS (PFT) — durée pédagogique');
    if (app.ck.s.eng.L.starterOverrun || app.ck.s.eng.R.starterOverrun) n.push('⚠ Démarreur maintenu > 10 s (OM-B CAUTION)');
    var txt = n.join(' · ');
    if (txt !== noteEl._t) { noteEl._t = txt; noteEl.textContent = txt; noteEl.classList.toggle('hidden', !txt); }
  }

  /* Barre d'outils cockpit (réduite à l'essentiel) */
  K.$('tbHome').onclick = function () { app.view.home(true); };
  K.$('tbLook').onclick = function () { app.modes.armLook(); };
  K.$('tbCallout').onclick = function () { if (TF.Ess.onCallout && TF.Ess.onCallout()) return; TF.Interact.declareCallout(); };
  K.$('tbRate').onclick = function () { app.modes.cycleRate(); };
  K.$('tbVerif').onclick = function () { TF.Interact.openDeclaratives(); };
  K.$('tbHint').onclick = function () { app.modes.hint(); };
  K.$('tbStop').onclick = function () { if (app.modes.level === 'discover' && app.modes.phase) { if (!app.modes.paused) app.modes.togglePause(); } else TF.Voice.stop(); };

  /* Barre supérieure */
  K.$('btnHome').onclick = function () { TF.Voice.stop(); K.closeSheet(); if (TF.Ess.active()) TF.Ess.stop(true); app.modes.idle(); TF.Ess.show(); };
  K.$('btnEss').onclick = function () { TF.Voice.stop(); K.closeSheet(); if (TF.Ess.active()) TF.Ess.stop(true); TF.Ess.close(); app.modes.idle(); TF.Home.show(); };
  K.$('btnProfile').onclick = function () { TF.Screens.profile(); };
  K.$('btnBrand').onclick = function () { TF.Screens.splash(function () { app.onProfile(); }); };
  K.$('btnLabels').onclick = function () { var on = !app.view.showLabels; app.view.setLabels(on); this.classList.toggle('on', on); var p = TF.Profiles.current(); if (p) TF.Profiles.setSetting('showLabels', on); };
  K.$('btnSound').onclick = function () { var on = !K.sound.enabled(); K.sound.setEnabled(on); TF.Voice.setEnabled(on); this.classList.toggle('on', on); this.textContent = on ? '🔊' : '🔇'; var p = TF.Profiles.current(); if (p) { TF.Profiles.setSetting('sound', on); TF.Profiles.setSetting('voice', on); } };
  K.$('btnFull').onclick = function () {
    var d = document, de = d.documentElement;
    var fs = d.fullscreenElement || d.webkitFullscreenElement;
    if (fs) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    var req = de.requestFullscreen || de.webkitRequestFullscreen;
    try { if (req) req.call(de); else throw 0; } catch (e) { K.toast('Sur iPad : Partager → « Sur l\'écran d\'accueil » pour un plein écran sans menus.', 'warn', 4500); }
  };
  K.$('instrToggle').onclick = function () { K.$('instructor').classList.toggle('collapsed'); setTimeout(function () { app.view.resize(); }, 280); };
  K.$('sheetWrap').addEventListener('click', function (e) { if (e.target === K.$('sheetWrap')) { TF.Voice.stop(); K.closeSheet(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (K.sheetOpen()) K.closeSheet(); else K.closePopover(); }
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'h') app.view.home(true);
    if (e.key === 'n') K.$('btnLabels').click();
    if (e.key === 'a' || e.key === ' ') { e.preventDefault(); TF.Interact.declareCallout(); }
    if (e.key === 'c') app.modes.armLook();
    if (e.key === 'i') app.modes.hint();
  });

  app.onProfile = function () {
    var p = TF.Profiles.current(); if (!p) return;
    K.$('profileName').textContent = p.name;
    app.view.setLabels(!!p.settings.showLabels); K.$('btnLabels').classList.toggle('on', !!p.settings.showLabels);
    K.sound.setEnabled(p.settings.sound !== false); K.$('btnSound').classList.toggle('on', p.settings.sound !== false);
    TF.Voice.setEnabled(p.settings.voice !== false);
    app.modes.idle(); TF.Ess.show();
  };

  /* Accueil */
  TF.Board.init();
  TF.MiniMap.init(); setInterval(function () { TF.MiniMap.update(); }, 250);
  TF.Screens.splash(function () { app.onProfile(); app.view.resize(); app.view.home(false); });
  app.modes.render();
  app.modes.setChip();

  /* Hors connexion : service worker si servi en http(s) */
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    // Mise à jour : on vérifie à chaque ouverture (et au retour sur l'appli) ; la nouvelle version s'installe puis la page se recharge une fois.
    var hadCtrl = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      try { reg.update(); } catch (e) { }
      document.addEventListener('visibilitychange', function () { if (!document.hidden) { try { reg.update(); } catch (e) { } } });
    }).catch(function () { });
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadCtrl || reloaded) return; reloaded = true;
      var busy = app.modes.phase && app.modes.mode !== 'done';
      if (busy) K.toast('🔄 Nouvelle version disponible : elle sera active à la prochaine ouverture.', '', 4000);
      else location.reload();
    });
  }
})(this);

</script>
